<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokémon GO Dex &amp; CP Calculator</title>

  <!-- React 18 + Babel (in-browser JSX transform, no build step needed) -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- App styles -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div id="root"></div>

<!--
  Load order matters — each file adds to the global scope.
  Dependencies must be loaded before the files that use them.

  Order:
    1. constants   — CPM, TYPE_COLORS, COUNTERS, etc.
    2. utils       — calcCP, goStats, fmtName, etc.  (needs constants)
    3. api         — fetchPoke, fetchList, etc.       (needs utils + constants)
    4. atoms       — Spinner, TypeBadge, etc.         (needs utils + constants)
    5. components  — feature components               (need atoms + api + utils)
    6. App         — root component + ReactDOM.render (needs everything)
-->

<!-- 1. Data / constants -->
<script type="text/babel" src="js/constants.js"></script>

<!-- 2. Pure utility functions -->
<script type="text/babel" src="js/utils.js"></script>

<!-- 3. API layer -->
<script type="text/babel" src="js/api.js"></script>

<!-- 4. Atom / primitive UI components -->
<script type="text/babel" src="js/components/atoms.js"></script>

<!-- 5. Feature components (order within this group is independent) -->
<script type="text/babel" src="js/components/SearchBar.js"></script>
<script type="text/babel" src="js/components/DexGrid.js"></script>
<script type="text/babel" src="js/components/PokemonCard.js"></script>
<script type="text/babel" src="js/components/DetailPanel.js"></script>
<script type="text/babel" src="js/components/CPCalc.js"></script>
<script type="text/babel" src="js/components/IVChart.js"></script>
<script type="text/babel" src="js/components/RaidIVChart.js"></script>
<script type="text/babel" src="js/components/RaidCounters.js"></script>
<script type="text/babel" src="js/components/MovesPanel.js"></script>
<script type="text/babel" src="js/components/EvoChain.js"></script>
<script type="text/babel" src="js/components/ComparePanel.js"></script>
<script type="text/babel" src="js/components/TodayPanel.js"></script>
<script type="text/babel" src="js/components/RaidExportCard.js"></script>

<!-- 6. Root App component + ReactDOM mount -->
<script type="text/babel" src="js/App.js"></script>

</body>
</html>
