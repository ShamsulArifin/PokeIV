// ── UTILITIES ─────────────────────────────────────────────────────────────
function calcCP(atk, def, hp, aIV, dIV, hIV, lv) {
  const m = CP_MULTIPLIERS[lv] || 0.79030001;
  return Math.max(10, Math.floor((atk+aIV)*Math.pow(def+dIV,0.5)*Math.pow(hp+hIV,0.5)*m*m/10));
}
function calcHP(hp, hIV, lv) {
  return Math.max(10, Math.floor((hp+hIV)*(CP_MULTIPLIERS[lv]||0.79030001)));
}
function capitalize(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : ''; }
function padId(id){ return String(id).padStart(4,'0'); }

function getGoStats(pokemon) {
  const s = {};
  pokemon.stats.forEach(x => { s[x.stat.name] = x.base_stat; });
  return {
    attack:  Math.max(1, Math.round((s['attack']+s['special-attack'])*0.875 + s['speed']*0.125)),
    defense: Math.max(1, Math.round((s['defense']+s['special-defense'])*0.875 + s['speed']*0.125)),
    hp:      Math.max(1, Math.floor(s['hp']*1.75+50)),
    rawStats: s,
  };
}

function getTypeWeaknesses(types) {
  const eff = {};
  types.forEach(type => {
    Object.entries(TYPE_EFFECTIVENESS[type]||{}).forEach(([at,m]) => {
      eff[at] = (eff[at]||1)*m;
    });
  });
  const weak=[], resist=[], immune=[];
  Object.entries(eff).forEach(([t,m]) => {
    if(m>=2) weak.push({type:t,mult:m});
    else if(m===0) immune.push({type:t});
    else if(m<1) resist.push({type:t,mult:m});
  });
  return {weak, resist, immune};
}

function getWeatherForTypes(types) {
  return Object.entries(WEATHER_BOOSTS)
    .filter(([,w]) => types.some(t => w.types.includes(t)))
    .map(([,w]) => w.label);
}

function typeEffVs(attackType, defTypes) {
  let m=1;
  defTypes.forEach(dt => { m *= (TYPE_EFFECTIVENESS[dt]||{})[attackType]??1; });
  return m;
}

function scoredCounters(defTypes) {
  const seen = new Set();
  const out  = [];
  for (const c of TOP_COUNTERS) {
    if (seen.has(c.name)) continue;
    seen.add(c.name);
    let best=0, bestType='';
    for (const t of [c.move, ...c.types]) {
      if (!t) continue;
      const e = typeEffVs(t, defTypes);
      if (e > best) { best=e; bestType=t; }
    }
    if (best >= 1.6) out.push({...c, eff:best, bestMoveType:bestType});
  }
  out.sort((a,b)=>b.eff-a.eff);
  return out.slice(0,10);
}

function reverseLookupCP(goStats, targetCP) {
  const rows = [];
  const levels = Object.keys(CP_MULTIPLIERS).map(Number).sort((a,b)=>a-b);
  for (const lv of levels) {
    for (let a=0;a<=15;a++) for (let d=0;d<=15;d++) for (let h=0;h<=15;h++) {
      if (calcCP(goStats.attack,goStats.defense,goStats.hp,a,d,h,lv)===targetCP)
        rows.push({level:lv,a,d,h,ivPct:Math.round(((a+d+h)/45)*100)});
    }
  }
  return rows;
}

function idFromUrl(url){ const m=url.match(/\/(\d+)\/$/); return m?parseInt(m[1]):0; }

function getFormTag(name) {
  if(name.endsWith('-shadow'))   return {tag:'Shadow',   color:'#7c3aed'};
  if(name.endsWith('-purified')) return {tag:'Purified',  color:'#06b6d4'};
  if(name.includes('-alola'))   return {tag:'Alolan',   color:'#f59e0b'};
  if(name.includes('-galar'))   return {tag:'Galarian',  color:'#ec4899'};
  if(name.includes('-hisui'))   return {tag:'Hisuian',   color:'#84cc16'};
  if(name.includes('-paldea'))  return {tag:'Paldean',   color:'#f97316'};
  if(name.includes('-mega'))    return {tag:'Mega',      color:'#6366f1'};
  if(name.includes('-gmax'))    return {tag:'G-Max',     color:'#ef4444'};
  if(name.includes('-primal'))  return {tag:'Primal',    color:'#dc2626'};
  if(name.includes('-origin'))  return {tag:'Origin',    color:'#8b5cf6'};
  if(name.includes('-therian')) return {tag:'Therian',   color:'#10b981'};
  return null;
}

function formatDisplayName(name) {
  return name
    .replace(/-mega-([xy])$/,(_, c)=>` Mega ${c.toUpperCase()}`)
    .replace(/-mega$/,' Mega').replace(/-gmax$/,' G-Max')
    .replace(/-alola$/,' (Alolan)').replace(/-galar$/,' (Galarian)')
    .replace(/-hisui$/,' (Hisuian)').replace(/-paldea$/,' (Paldean)')
    .replace(/-primal$/,' (Primal)').replace(/-origin$/,' (Origin)')
    .replace(/-therian$/,' (Therian)')
    .split('-').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
}

// ── API ───────────────────────────────────────────────────────────────────
const cache = {};
async function fetchPokemon(key) {
  key = String(key).toLowerCase();
  if (cache[key]) return cache[key];
  const r = await fetch(`https://pokeapi.co/api/v2/pokemon/${key}`);
  if (!r.ok) throw new Error('not found');
  return (cache[key] = await r.json());
}
async function fetchSpecies(key) {
  const ck = `sp_${key}`;
  if (cache[ck]) return cache[ck];
  const r = await fetch(`https://pokeapi.co/api/v2/pokemon-species/${key}`);
  if (!r.ok) return null;
  return (cache[ck] = await r.json());
}
async function fetchEvoChain(url) {
  if (cache[url]) return cache[url];
  const r = await fetch(url);
  if (!r.ok) return null;
  return (cache[url] = await r.json());
}
async function fetchPokemonList() {
  if (cache['full_list']) return cache['full_list'];
  const r = await fetch('https://pokeapi.co/api/v2/pokemon?limit=2000&offset=0');
  const data = await r.json();
  const list = data.results.map(p => {
    const id = idFromUrl(p.url);
    return { name:p.name, id, displayName:formatDisplayName(p.name), formTag:getFormTag(p.name), spriteId:id, isVirtual:false };
  });
  // inject shadow / purified virtual entries
  SHADOW_IDS.forEach(id => {
    const base = list.find(p => p.id===id && !p.name.includes('-'));
    if (!base) return;
    list.push({ name:base.name+'-shadow',   id, displayName:formatDisplayName(base.name)+' (Shadow)',
      formTag:{tag:'Shadow',color:'#7c3aed'},   spriteId:id, isVirtual:true, shadowType:'shadow',   baseName:base.name });
    list.push({ name:base.name+'-purified', id, displayName:formatDisplayName(base.name)+' (Purified)',
      formTag:{tag:'Purified',color:'#06b6d4'}, spriteId:id, isVirtual:true, shadowType:'purified', baseName:base.name });
  });
  return (cache['full_list'] = list);
}

function TypeBadge({ type, size='sm' }) {

function StatBar({ label, value, max=300, color='#818cf8' }) {
  const pct = Math.min(100,(value/max)*100);
  const auto = v => v>=200?'#34d399':v>=150?'#60a5fa':v>=100?'#818cf8':v>=50?'#fbbf24':'#f87171';
  const bar = color==='auto' ? auto(value) : color;
  return (
    <div className="flex items-center gap-2 mb-1.5">
      <span className="text-gray-400 text-xs w-20 shrink-0">{label}</span>
      <div className="stat-bar flex-1">
        <div className="stat-fill" style={{width:`${pct}%`,background:`linear-gradient(90deg,${bar}aa,${bar})`}} />
      </div>
      <span className="text-white text-xs w-8 text-right font-semibold">{value}</span>
    </div>
  );
}

function Slider({ label, value, onChange, min=0, max=50, step=0.5, color='#6366f1', showInput=false }) {
  const pct = ((value-min)/(max-min))*100;
  return (
    <div className="glass rounded-xl p-4 space-y-2">
      <div className="flex justify-between items-center">
        <label className="text-gray-300 text-sm font-semibold">{label}</label>

          <input type="number" value={value} min={min} max={max} step={step}
            onChange={e=>{const v=parseFloat(e.target.value);if(v>=min&&v<=max&&(step<1||Number.isInteger(v/step)))onChange(v);}}
            className="w-16 text-center bg-indigo-500/20 border border-indigo-500/40 rounded-lg px-2 py-0.5 text-indigo-300 font-bold text-sm focus:outline-none" />
        ) : (
          <span className="font-bold text-sm px-2 py-0.5 rounded-lg bg-white/10" style={{color}}>{value}</span>
        )}
      </div>
      <input type="range" min={min} max={max} step={step} value={value}
        onChange={e=>onChange(parseFloat(e.target.value))}
        className="slider-thumb w-full"
        style={{background:`linear-gradient(90deg,${color} ${pct}%,rgba(255,255,255,0.1) ${pct}%)`}} />
      <div className="flex justify-between text-gray-600 text-xs"><span>{min}</span><span>{max}</span></div>
    </div>

}

function PokemonImage({ pokemon, isShiny, is3D, shadowType, className='', size=96 }) {
  const [err, setErr] = React.useState(false);

  React.useEffect(()=>{setErr(false);setLoaded(false);},[pokemon?.id,isShiny,is3D]);
  let src = null;
  if (!err) {
    if (is3D) src = isShiny ? pokemon?.sprites?.other?.home?.front_shiny : pokemon?.sprites?.other?.home?.front_default;
    if (!src) src = isShiny ? pokemon?.sprites?.other?.['official-artwork']?.front_shiny : pokemon?.sprites?.other?.['official-artwork']?.front_default;
    if (!src) src = isShiny ? pokemon?.sprites?.front_shiny : pokemon?.sprites?.front_default;
  }
  const glowClass = isShiny ? 'shiny-glow' : shadowType==='shadow' ? 'shadow-glow' : shadowType==='purified' ? 'purified-glow' : '';

    <div className="relative flex items-center justify-center" style={{width:size,height:size}}>

  React.useEffect(()=>{
    if (!query.trim()) { setResults([]); setOpen(false); return; }
    const q = query.toLowerCase().trim();
    const f = all.filter(p=>p.name.includes(q)||p.displayName.toLowerCase().includes(q)||String(p.id).startsWith(q)).slice(0,14);
    setResults(f); setOpen(f.length>0);
  },[query,all]);
  React.useEffect(()=>{
    const h = e => { if(ref.current&&!ref.current.contains(e.target)) setOpen(false); };

  },[]);
  const select = p => { setQuery(''); setOpen(false); onSelect(p.name); };

            <button key={p.name} onClick={()=>select(p)}

  const filtered = React.useMemo(()=>{
    let list = all;

    if(gen!=='all'){ const g=GENERATION_RANGES.find(x=>x.label===gen); if(g) list=list.filter(p=>p.id>=g.min&&p.id<=g.max); }
    if(form==='base')     list=list.filter(p=>!p.isVirtual&&!p.formTag);
    else if(form==='shadow')   list=list.filter(p=>p.shadowType==='shadow');
    else if(form==='purified') list=list.filter(p=>p.shadowType==='purified');
    else if(form==='alolan')   list=list.filter(p=>p.name.includes('-alola'));

    else if(form==='hisuian')  list=list.filter(p=>p.name.includes('-hisui'));

    else if(form==='mega')     list=list.filter(p=>p.name.includes('-mega')||p.name.includes('-primal'));
    else if(form==='forms')    list=list.filter(p=>p.formTag&&!p.isVirtual);
    return list;
  },[all,filter,gen,form]);
  React.useEffect(()=>setPage(0),[filter,gen,form]);

    {id:'mega',label:'Mega',c:'#6366f1'},{id:'forms',label:'Other Forms',c:'#a78bfa'},
    {id:'shadow',label:'👻 Shadow',c:'#7c3aed'},{id:'purified',label:'✨ Purified',c:'#06b6d4'},

    <div className="space-y-3">

        <div className="absolute left-3 top-1/2 -translate-y-1/2 text-indigo-400">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </div>

        {filter&&<button onClick={()=>setFilter('')} className="absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-600 hover:text-gray-400 text-xs">✕</button>}
      </div>
      <div className="flex gap-1 flex-wrap">
        <button onClick={()=>setGen('all')} className={`px-2 py-1 rounded-md text-xs font-semibold transition-all ${gen==='all'?'bg-indigo-600 text-white':'glass text-gray-500 hover:text-white'}`}>All</button>
        {GENERATION_RANGES.map(g=>(

  const cp    = React.useMemo(()=>goStats?calcCP(goStats.attack,goStats.defense,goStats.hp,aIV,dIV,hIV,level):0,[goStats,level,aIV,dIV,hIV]);
  const hp    = React.useMemo(()=>goStats?calcHP(goStats.hp,hIV,level):0,[goStats,hIV,level]);
  const maxCP = React.useMemo(()=>goStats?calcCP(goStats.attack,goStats.defense,goStats.hp,15,15,15,50):0,[goStats]);
  const pct   = maxCP>0?Math.min(100,(cp/maxCP)*100):0;
  const ivColor = p => p===100?'#fbbf24':p>=98?'#34d399':p>=93?'#60a5fa':p>=82?'#818cf8':'#9ca3af';
  const runLookup = ()=>{
    const t=parseInt(inputCP); if(!goStats||!t||t<10) return;
    setLookupBusy(true); setLookupRes(null);
    setTimeout(()=>{
      let r=reverseLookupCP(goStats,t);
      if(inputLv){ const lv=parseFloat(inputLv); r=r.filter(x=>x.level===lv); }
      r.sort((a,b)=>b.ivPct-a.ivPct);
      setLookupRes(r); setLookupBusy(false);
    },10);
  };
  if (!pokemon) return (
    <div className="flex flex-col items-center justify-center h-48 text-gray-600 gap-3">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><circle cx="12" cy="12" r="3"/></svg>
      <p className="text-sm">Select a Pokémon to calculate CP</p>
    </div>
  );
  return (
    <div className="animate-slide-up space-y-4">
      <div className="flex rounded-xl overflow-hidden border border-white/10">
        {[['calc','⚡ Calculate CP'],['lookup','🔍 CP → IVs']].map(([id,lbl])=>(
          <button key={id} onClick={()=>setTab(id)}
            className={`flex-1 py-2.5 text-sm font-semibold transition-all ${tab===id?'tab-active text-white':'text-gray-500 hover:text-gray-300 bg-white/5'}`}>{lbl}</button>
        ))}
      </div>

      {tab==='calc'&&(<>
        <div className="cp-display rounded-2xl p-5 text-center">
          <p className="text-gray-400 text-xs uppercase tracking-widest mb-1">Combat Power</p>
          <p className="text-6xl font-black text-white tracking-tight">{cp.toLocaleString()}</p>
          <div className="mt-3 stat-bar max-w-xs mx-auto">
            <div className="stat-fill" style={{width:`${pct}%`,background:'linear-gradient(90deg,#6366f1,#a855f7,#ec4899)'}} />
          </div>
          <p className="text-gray-500 text-xs mt-1">{pct.toFixed(1)}% of max CP ({maxCP.toLocaleString()})</p>
        </div>
        <div className="grid grid-cols-3 gap-2 text-center">
          {[['Attack',goStats.attack+aIV,'#f87171'],['Defense',goStats.defense+dIV,'#60a5fa'],['HP',hp,'#34d399']].map(([l,v,c])=>(
            <div key={l} className="glass rounded-xl p-2.5" style={{border:`1px solid ${c}30`}}>
              <p className="text-xs font-medium" style={{color:c}}>{l}</p>
              <p className="text-white font-bold text-lg">{v}</p>
            </div>
          ))}
        </div>
        <Slider label="Level" value={level} onChange={setLevel} min={1} max={50} step={0.5} color="#6366f1" showInput={true} />
        <IVSlider label="Attack IV"  value={aIV} onChange={setAIV} color="#f87171" />
        <IVSlider label="Defense IV" value={dIV} onChange={setDIV} color="#60a5fa" />
        <IVSlider label="HP IV"      value={hIV} onChange={setHIV} color="#34d399" />
      </>)}

      {tab==='lookup'&&(
        <div className="space-y-4">
          <p className="text-gray-400 text-sm">Enter a CP value (and optionally a level) to find all matching IV combinations.</p>
          <div className="glass rounded-xl p-4 space-y-3">
            <div className="flex gap-3">
              <div className="flex-1">
                <label className="text-gray-400 text-xs font-semibold block mb-1">CP Value</label>
                <input type="number" value={inputCP} onChange={e=>setInputCP(e.target.value)} onKeyDown={e=>e.key==='Enter'&&runLookup()}
                  placeholder="e.g. 2532" className="w-full bg-white/10 border border-white/20 rounded-lg px-3 py-2 text-white text-sm placeholder-gray-600 focus:outline-none focus:border-indigo-500 transition-colors" />
              </div>
              <div className="w-28">
                <label className="text-gray-400 text-xs font-semibold block mb-1">Level (optional)</label>
                <input type="number" value={inputLv} onChange={e=>setInputLv(e.target.value)} placeholder="e.g. 20" min="1" max="50" step="0.5"
                  className="w-full bg-white/10 border border-white/20 rounded-lg px-3 py-2 text-white text-sm placeholder-gray-600 focus:outline-none focus:border-indigo-500 transition-colors" />
              </div>
            </div>
            <button onClick={runLookup} disabled={!inputCP||lookupBusy}
              className="w-full py-2.5 rounded-xl text-sm font-bold transition-all disabled:opacity-40"
              style={{background:'linear-gradient(135deg,#6366f1,#8b5cf6)'}}>
              {lookupBusy?'Searching…':'🔍 Find IVs'}
            </button>
          </div>
          {lookupBusy&&<div className="flex justify-center py-6"><LoadingSpinner /></div>}
          {lookupRes!==null&&!lookupBusy&&(
            <div className="glass rounded-xl overflow-hidden">
              {lookupRes.length===0?(
                <div className="py-8 text-center text-gray-500 text-sm">
                  No IV combinations produce CP {inputCP}{inputLv?` at level ${inputLv}`:''}.
                  <br/><span className="text-gray-600 text-xs">Try a different CP or remove the level filter.</span>
                </div>
              ):(
                <>
                  <div className="px-4 py-2.5 border-b border-white/10 flex items-center justify-between" style={{background:'rgba(255,255,255,0.04)'}}>
                    <p className="text-white text-sm font-semibold">CP {inputCP} → {lookupRes.length} match{lookupRes.length!==1?'es':''}</p>
                    <p className="text-gray-500 text-xs">sorted by IV%</p>
                  </div>
                  <table className="w-full text-xs">
                    <thead><tr className="border-b border-white/10" style={{background:'rgba(255,255,255,0.03)'}}>
                      <th className="px-3 py-2 text-center text-gray-500">Lv</th>
                      <th className="px-3 py-2 text-center text-gray-500">IV%</th>
                      <th className="px-3 py-2 text-center text-red-400">ATK</th>
                      <th className="px-3 py-2 text-center text-blue-400">DEF</th>
                      <th className="px-3 py-2 text-center text-green-400">HP</th>
                      <th className="px-3 py-2 text-center text-gray-400">In-game HP</th>
                    </tr></thead>
                    <tbody>
                      {lookupRes.map((r,i)=>{
                        const c=ivColor(r.ivPct); const hun=r.a===15&&r.d===15&&r.h===15;
                        return (
                          <tr key={i} className="border-b hover:bg-white/5 transition-colors"
                            style={{borderColor:'rgba(255,255,255,0.05)',background:hun?'rgba(251,191,36,0.08)':''}}>
                            <td className="px-3 py-2 text-center text-gray-300 font-semibold">{r.level}</td>
                            <td className="px-3 py-2 text-center font-bold" style={{color:c}}>{hun?'⭐':''}{r.ivPct}%</td>
                            <td className="px-3 py-2 text-center font-mono font-semibold" style={{color:r.a===15?'#f87171':r.a>=13?'#fca5a5':'#9ca3af'}}>{r.a}</td>
                            <td className="px-3 py-2 text-center font-mono font-semibold" style={{color:r.d===15?'#60a5fa':r.d>=13?'#93c5fd':'#9ca3af'}}>{r.d}</td>
                            <td className="px-3 py-2 text-center font-mono font-semibold" style={{color:r.h===15?'#34d399':r.h>=13?'#6ee7b7':'#9ca3af'}}>{r.h}</td>
                            <td className="px-3 py-2 text-center text-green-400">{calcHP(goStats.hp,r.h,r.level)}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </>
              )}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ── RAID IV CHART ─────────────────────────────────────────────────────────
function RaidIVChart({ pokemon }) {
  const goStats = React.useMemo(()=>pokemon?getGoStats(pokemon):null,[pokemon]);
  const types   = pokemon?.types?.map(t=>t.type.name)||[];
  const weathers = React.useMemo(()=>getWeatherForTypes(types),[types.join(',')]);
  const [encKey, setEncKey]   = React.useState('raid');
  const [minCP, setMinCP]     = React.useState('');
  const [maxCP, setMaxCP]     = React.useState('');
  const [ivFilter, setIVF]    = React.useState('all');
  const [sortBy, setSort]     = React.useState('iv');
  const [showTop, setShowTop] = React.useState(50);
  const enc = ENCOUNTER_TYPES[encKey];
  const allRows = React.useMemo(()=>{
    if(!goStats) return [];
    const rows=[]; const fl=enc.floor;
    for(let a=15;a>=fl;a--) for(let d=15;d>=fl;d--) for(let h=15;h>=fl;h--){
      rows.push({a,d,h,
        cpN: calcCP(goStats.attack,goStats.defense,goStats.hp,a,d,h,enc.level),
        cpB: enc.hasBoosted?calcCP(goStats.attack,goStats.defense,goStats.hp,a,d,h,enc.boostedLevel):null,
        hpN: calcHP(goStats.hp,h,enc.level),
        ivPct: Math.round(((a+d+h)/45)*100),
      });
    }
    return rows;
  },[goStats,encKey]);
  const filtered = React.useMemo(()=>{
    let r=allRows;
    const lo=parseInt(minCP)||0, hi=parseInt(maxCP)||Infinity;
    if(lo||hi<Infinity) r=r.filter(x=>(enc.hasBoosted?[x.cpN,x.cpB]:[x.cpN]).some(v=>v>=lo&&v<=hi));
    if(ivFilter==='hundo') r=r.filter(x=>x.a===15&&x.d===15&&x.h===15);
    else if(ivFilter==='lucky') r=r.filter(x=>x.a>=12&&x.d>=12&&x.h>=12);
    else if(ivFilter==='98')    r=r.filter(x=>x.ivPct>=98);
    else if(ivFilter==='93')    r=r.filter(x=>x.ivPct>=93);
    const km={iv:'ivPct',cp:'cpN',atk:'a',def:'d',hp:'h'};
    r=[...r].sort((a,b)=>b[km[sortBy]||'ivPct']-a[km[sortBy]||'ivPct']);
    return r.slice(0,showTop);
  },[allRows,minCP,maxCP,ivFilter,sortBy,showTop]);
  const ivStyle = p => p===100?{c:'#fbbf24',bg:'rgba(251,191,36,0.15)'}:p>=98?{c:'#34d399',bg:'rgba(52,211,153,0.1)'}:p>=93?{c:'#60a5fa',bg:'rgba(96,165,250,0.1)'}:p>=82?{c:'#818cf8',bg:'rgba(129,140,248,0.08)'}:{c:'#9ca3af',bg:'transparent'};
  const ivC = (v,fl) => v===15?'#f87171':v>=13?'#fca5a5':v===fl?'#6b7280':'#d1d5db';
  const hundoN = goStats?calcCP(goStats.attack,goStats.defense,goStats.hp,15,15,15,enc.level):0;
  const hundoB = goStats&&enc.hasBoosted?calcCP(goStats.attack,goStats.defense,goStats.hp,15,15,15,enc.boostedLevel):0;
  if(!pokemon) return <div className="py-12 text-center text-gray-600 text-sm">Select a Pokémon</div>;
  return (
    <div className="animate-slide-up space-y-4">
      <div className="glass rounded-xl p-4 space-y-2">
        <p className="text-gray-300 text-xs font-semibold uppercase tracking-widest">Encounter Type</p>
        <div className="flex flex-wrap gap-2">
          {Object.entries(ENCOUNTER_TYPES).map(([k,e])=>(
            <button key={k} onClick={()=>{setEncKey(k);setShowTop(50);}}
              className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${encKey===k?'bg-indigo-600 text-white':'glass text-gray-400 hover:text-white'}`}>{e.label}</button>
          ))}
        </div>
      </div>
      <div className="grid grid-cols-2 gap-3">
        <div className="glass rounded-xl p-3 text-center" style={{border:'1px solid rgba(251,191,36,0.3)',background:'rgba(251,191,36,0.07)'}}>
          <p className="text-yellow-400 text-xs font-semibold">⭐ Hundo (Lv{enc.level})</p>
          <p className="text-white font-black text-xl">{hundoN.toLocaleString()}</p>
          <p className="text-gray-500 text-xs">15/15/15</p>
        </div>
        {enc.hasBoosted?(
          <div className="glass rounded-xl p-3 text-center" style={{border:'1px solid rgba(99,102,241,0.3)',background:'rgba(99,102,241,0.07)'}}>
            <p className="text-indigo-400 text-xs font-semibold">🌤️ Boosted Hundo (Lv{enc.boostedLevel})</p>
            <p className="text-white font-black text-xl">{hundoB.toLocaleString()}</p>
            {weathers.length>0&&<p className="text-gray-500 text-xs truncate">{weathers.join(' / ')}</p>}
          </div>
        ):(
          <div className="glass rounded-xl p-3 text-center">
            <p className="text-gray-500 text-xs font-semibold">IV Floor</p>
            <p className="text-white font-black text-xl">{enc.floor}/{enc.floor}/{enc.floor}</p>
            <p className="text-gray-600 text-xs">Catch Lv{enc.level}</p>
          </div>
        )}
      </div>
      {enc.hasBoosted&&weathers.length>0&&(
        <div className="glass rounded-xl p-3" style={{border:'1px solid rgba(56,189,248,0.2)',background:'rgba(56,189,248,0.05)'}}>
          <p className="text-sky-400 text-xs font-semibold mb-1">Weather Boost Active When:</p>
          <div className="flex flex-wrap gap-2">{weathers.map((w,i)=><span key={i} className="text-xs text-sky-300 bg-sky-500/10 border border-sky-500/20 px-2.5 py-1 rounded-lg">{w}</span>)}</div>
        </div>
      )}
      <div className="glass rounded-xl p-3 flex flex-wrap gap-x-6 gap-y-1 text-xs text-gray-400">
        <span>🔒 IV Floor: <strong className="text-white">{enc.floor}/{enc.floor}/{enc.floor}</strong></span>
        <span>📊 Catch Level: <strong className="text-white">{enc.level}{enc.hasBoosted?` / ${enc.boostedLevel} (boosted)`:''}</strong></span>
        <span>🎲 Combos: <strong className="text-white">{allRows.length.toLocaleString()}</strong></span>
      </div>
      <div className="space-y-2">
        <div className="flex gap-2 items-center flex-wrap">
          <input type="number" value={minCP} onChange={e=>setMinCP(e.target.value)} placeholder="Min CP"
            className="w-28 bg-white/10 border border-white/20 rounded-lg px-3 py-1.5 text-white text-xs placeholder-gray-600 focus:outline-none focus:border-indigo-500 transition-colors" />
          <span className="text-gray-600">–</span>
          <input type="number" value={maxCP} onChange={e=>setMaxCP(e.target.value)} placeholder="Max CP"
            className="w-28 bg-white/10 border border-white/20 rounded-lg px-3 py-1.5 text-white text-xs placeholder-gray-600 focus:outline-none focus:border-indigo-500 transition-colors" />
          {(minCP||maxCP)&&<button onClick={()=>{setMinCP('');setMaxCP('');}} className="px-2 py-1.5 glass rounded-lg text-gray-500 hover:text-white text-xs transition-colors">✕</button>}
          <span className="ml-auto text-gray-600 text-xs">{filtered.length} results</span>
        </div>
        <div className="flex flex-wrap gap-1.5">
          {[['All','all','#6b7280'],['⭐ Hundo','hundo','#fbbf24'],['Lucky (12+)','lucky','#34d399'],['≥98%','98','#60a5fa'],['≥93%','93','#818cf8']].map(([l,v,c])=>(
            <button key={v} onClick={()=>setIVF(v)}
              className="px-2.5 py-1 rounded-lg text-xs font-semibold transition-all"
              style={ivFilter===v?{background:c+'33',color:c,border:`1px solid ${c}55`}:{background:'rgba(255,255,255,0.05)',color:'#6b7280',border:'1px solid rgba(255,255,255,0.1)'}}>
              {l}
            </button>
          ))}
        </div>
        <div className="flex gap-1.5 items-center">
          <span className="text-gray-600 text-xs">Sort:</span>
          {[['IV%','iv'],['CP','cp'],['ATK','atk'],['DEF','def'],['HP','hp']].map(([l,v])=>(
            <button key={v} onClick={()=>setSort(v)}
              className={`px-2.5 py-1 rounded-lg text-xs font-semibold transition-all ${sortBy===v?'bg-indigo-600 text-white':'glass text-gray-500 hover:text-white'}`}>{l}</button>
          ))}
        </div>
      </div>
      <div className="glass rounded-xl overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full text-xs">
            <thead><tr className="border-b border-white/10" style={{background:'rgba(255,255,255,0.04)'}}>
              <th className="px-2 py-2.5 text-left text-gray-500">#</th>
              <th className="px-2 py-2.5 text-center text-gray-400">IV%</th>
              <th className="px-2 py-2.5 text-center text-red-400">ATK</th>
              <th className="px-2 py-2.5 text-center text-blue-400">DEF</th>
              <th className="px-2 py-2.5 text-center text-green-400">HP</th>
              <th className="px-2 py-2.5 text-center text-white">CP (Lv{enc.level})</th>
              {enc.hasBoosted&&<th className="px-2 py-2.5 text-center text-indigo-400">CP (Lv{enc.boostedLevel} 🌤️)</th>}
              <th className="px-2 py-2.5 text-center text-green-400">HP</th>
            </tr></thead>
            <tbody>
              {filtered.map((row,i)=>{
                const {c,bg}=ivStyle(row.ivPct); const hun=row.a===15&&row.d===15&&row.h===15;
                return (
                  <tr key={`${row.a}-${row.d}-${row.h}`} className="border-b hover:bg-white/5 transition-colors"
                    style={{borderColor:'rgba(255,255,255,0.05)',background:bg}}>
                    <td className="px-2 py-2 text-gray-600">{i+1}</td>
                    <td className="px-2 py-2 text-center font-bold" style={{color:c}}>{hun?'⭐':''}{row.ivPct}%</td>
                    <td className="px-2 py-2 text-center font-mono font-semibold" style={{color:ivC(row.a,enc.floor)}}>{row.a}</td>
                    <td className="px-2 py-2 text-center font-mono font-semibold" style={{color:ivC(row.d,enc.floor)}}>{row.d}</td>
                    <td className="px-2 py-2 text-center font-mono font-semibold" style={{color:ivC(row.h,enc.floor)}}>{row.h}</td>
                    <td className="px-2 py-2 text-center font-bold text-white">{row.cpN.toLocaleString()}</td>
                    {enc.hasBoosted&&<td className="px-2 py-2 text-center font-bold text-indigo-300">{row.cpB?.toLocaleString()}</td>}
                    <td className="px-2 py-2 text-center text-green-400">{row.hpN}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          {filtered.length===0&&<div className="py-10 text-center text-gray-600 text-sm">No results match your filters</div>}
        </div>
      </div>
      {showTop<allRows.length&&<button onClick={()=>setShowTop(t=>t+100)}
        className="w-full py-2.5 glass rounded-xl text-gray-400 hover:text-white text-sm transition-colors hover:bg-white/10">
        Show more ({allRows.length-showTop} remaining)</button>}
    </div>
  );
}

             : <div className="w-16 h-16 flex items-center justify-center"><LoadingSpinner size="sm" /></div>}

    </button>

}
function EvoArrow({ detail }) {
  return (
    <div className="flex flex-col items-center justify-center px-1 min-w-[56px]">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" className="text-indigo-400">
        <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
      </svg>
      {detail&&<span className="text-gray-600 text-xs text-center mt-0.5 max-w-[56px] leading-tight">{detail}</span>}
    </div>
  );
}
function parseEvoChain(chain) {
  const stages=[];
  const walk=(node,s)=>{
    if(!stages[s]) stages[s]=[];
    const det=node.evolution_details?.[0]; let req='';
    if(det){
      if(det.min_level) req=`Lv.${det.min_level}`;
      else if(det.item) req=capitalize(det.item.name.replace(/-/g,' '));
      else if(det.held_item) req=capitalize(det.held_item.name.replace(/-/g,' '));
      else if(det.trigger?.name==='trade') req='Trade';
      else if(det.min_happiness) req=`Happy(${det.min_happiness})`;
      else req=capitalize((det.trigger?.name||'').replace(/-/g,' '));
    }
    stages[s].push({name:node.species.name,req});
    node.evolves_to.forEach(n=>walk(n,s+1));
  };
  walk(chain,0); return stages;
}
function EvolutionChain({ speciesName, isShiny, is3D, onSelect, activeName }) {
  const [stages, setStages] = React.useState(null);
  const [loading, setLoading] = React.useState(false);
  React.useEffect(()=>{
    if(!speciesName) return;
    setLoading(true); setStages(null);
    fetchSpecies(speciesName)
      .then(sp=>sp?fetchEvoChain(sp.evolution_chain.url):null)
      .then(chain=>{ if(chain) setStages(parseEvoChain(chain.chain)); })
      .catch(()=>{}).finally(()=>setLoading(false));
  },[speciesName]);
  if(loading) return <div className="flex justify-center py-4"><LoadingSpinner /></div>;
  if(!stages) return null;
  if(stages.length<=1&&stages[0]?.length<=1) return <div className="text-gray-600 text-sm text-center py-2">No evolutions</div>;
  return (
    <div className="flex flex-wrap items-center justify-center gap-1 py-2">
      {stages.map((stage,si)=>(
        <React.Fragment key={si}>
          {si>0&&(
            <div className="flex flex-col gap-2">
              {stage.some(n=>n.req) ? stage.map(n=>n.req&&<EvoArrow key={n.name} detail={n.req} />) : <EvoArrow detail="" />}
            </div>
          )}
          <div className={`flex flex-col gap-2 ${stage.length>1?'justify-center':''}`}>
            {stage.map(n=><EvoNode key={n.name} name={n.name} isShiny={isShiny} is3D={is3D} onSelect={onSelect} isActive={n.name===activeName} />)}
          </div>
        </React.Fragment>
      ))}
    </div>
  );
}

          <p className="text-indigo-400 text-xs font-semibold mb-1">Pokémon GO Stats</p>

            </div>
            <div className="hidden sm:block">
              <h1 className="text-white font-black text-sm leading-none">Pokémon GO</h1>
              <p className="text-indigo-400 text-xs font-semibold">Dex &amp; CP Calculator</p>
            </div>
          </div>
          <div className="flex-1 max-w-md"><SearchBar onSelect={loadPokemon} /></div>
          <div className="flex gap-2 shrink-0">
            <button onClick={()=>setMode('dex')}
              className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${mode==='dex'?'bg-indigo-600 text-white':'glass text-gray-400 hover:text-white'}`}>📖 Dex</button>
            <button onClick={()=>setMode('compare')}
              className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${mode==='compare'?'bg-pink-600 text-white':'glass text-gray-400 hover:text-white'}`}>⚖️ Compare</button>
          </div>
        </div>
      </header>

      {mode==='compare' ? (
        <main className="max-w-5xl mx-auto px-4 py-6">
          <div className="mb-4">
            <h2 className="text-white font-black text-xl">Side-by-Side Comparison</h2>
            <p className="text-gray-500 text-sm">Compare Pokémon GO stats and max CP side by side</p>
          </div>
          <ComparePanel isShiny={isShiny} is3D={is3D} />
        </main>
      ) : (
        <main className="max-w-7xl mx-auto px-4 py-6">
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="lg:col-span-1">
              <div className="glass-dark rounded-2xl p-4">
                <button onClick={()=>setShowDex(!showDex)} className="flex items-center justify-between w-full lg:cursor-default mb-3">
                  <h3 className="text-white font-bold text-sm uppercase tracking-widest">Pokédex</h3>
                  <span className="lg:hidden text-gray-400 text-xs">{showDex?'▲ Hide':'▼ Show'}</span>
                </button>
                <div className={`${showDex?'block':'hidden'} lg:block`}>
                  <PokedexGrid onSelect={loadPokemon} activeName={activePokemon?.name} />
                </div>
              </div>
            </div>

            <div className="lg:col-span-2 space-y-4">
              {loading&&(
                <div className="glass-dark rounded-2xl p-12 flex flex-col items-center gap-4">
                  <LoadingSpinner size="lg" /><p className="text-gray-500 text-sm">Loading…</p>
                </div>
              )}
              {error&&!loading&&(
                <div className="glass-dark rounded-2xl p-8 text-center">
                  <p className="text-red-400 text-4xl mb-3">😵</p>
                  <p className="text-red-400 font-semibold">{error}</p>
                  <p className="text-gray-600 text-sm mt-1">Try "pikachu", "charizard" or a Pokédex number</p>
                </div>
              )}
              {activePokemon&&!loading&&(
                <>
                  <PokemonCard pokemon={activePokemon} species={activeSpecies}
                    isShiny={isShiny} is3D={is3D} shadowType={activeShadow}
                    onToggleShiny={setIsShiny} onToggle3D={setIs3D} />
                  <div className="glass-dark rounded-2xl overflow-hidden">
                    <div className="flex border-b border-white/10 overflow-x-auto">
                      {tabs.map(t=>(
                        <button key={t.id} onClick={()=>setActiveTab(t.id)}
                          className={`flex-1 min-w-max py-3 px-2 text-xs font-semibold transition-all duration-200 flex items-center justify-center gap-1 ${activeTab===t.id?'tab-active text-white':'text-gray-500 hover:text-gray-300 hover:bg-white/5'}`}>
                          <span>{t.icon}</span><span>{t.label}</span>
                        </button>
                      ))}
                    </div>
                    <div className="p-5">
                      {activeTab==='info'&&     <DetailPanel pokemon={activePokemon} species={activeSpecies} />}
                      {activeTab==='cp'&&        <CPCalculator pokemon={activePokemon} />}
                      {activeTab==='iv'&&        <IVChart pokemon={activePokemon} />}
                      {activeTab==='raid'&&      <RaidIVChart pokemon={activePokemon} />}
                      {activeTab==='counters'&&  <RaidCounters pokemon={activePokemon} />}
                      {activeTab==='evo'&&(
                        <div>
                          <p className="text-gray-400 text-xs uppercase tracking-widest font-semibold mb-3">Evolution Chain</p>
                          <EvolutionChain speciesName={activePokemon.species?.name||activePokemon.name}
                            isShiny={isShiny} is3D={is3D} onSelect={loadPokemon} activeName={activePokemon.name} />
                        </div>
                      )}
                    </div>
                  </div>
                </>
              )}
              {!activePokemon&&!loading&&!error&&(
                <div className="glass-dark rounded-2xl p-12 flex flex-col items-center gap-4 text-center">
                  <div className="text-6xl">🔴</div>
                  <h3 className="text-white font-bold text-xl">Welcome to GO Dex</h3>
                  <p className="text-gray-500 text-sm max-w-sm">Search for any Pokémon or browse the Pokédex on the left.</p>
                </div>
              )}
            </div>
          </div>
        </main>
      )}

      <footer className="text-center py-6 text-gray-700 text-xs">
        <p>Pokémon GO Dex &amp; CP Calculator • Data from <a href="https://pokeapi.co" className="text-indigo-500 hover:text-indigo-400" target="_blank" rel="noopener">PokéAPI</a></p>
        <p className="mt-1">Not affiliated with Niantic, Inc. or Nintendo</p>
      </footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
