<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokémon GO Dex & CP Calculator</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #111118;
      --s1: #1c1c26;
      --s2: #242430;
      --s3: #2e2e3d;
      --border: rgba(255,255,255,0.08);
      --border2: rgba(255,255,255,0.14);
      --text: #eeeef5;
      --muted: #888899;
      --dim: #555566;
      --accent: #5b5ef4;
      --accent-light: #818cf8;
      --r-sm: 10px;
      --r-md: 14px;
      --r-lg: 18px;
    }
    html, body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; overflow-x: hidden; -webkit-text-size-adjust: 100%; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--s3); border-radius: 10px; }

    /* ── Cards ─────────────────────────────── */
    .card  { background: var(--s1); border: 1px solid var(--border); border-radius: var(--r-lg); }
    .card2 { background: var(--s2); border: 1px solid var(--border); border-radius: var(--r-md); }
    .card3 { background: var(--s2); border: 1px solid var(--border); border-radius: var(--r-sm); }

    /* ── Inputs ────────────────────────────── */
    .inp {
      background: var(--s2); border: 1px solid var(--border2); border-radius: var(--r-sm);
      color: var(--text); padding: 9px 12px; font-size: 14px; font-family: inherit;
      outline: none; width: 100%; transition: border-color .15s;
    }
    .inp::placeholder { color: var(--dim); }
    .inp:focus { border-color: var(--accent); }
    @media (max-width: 640px) { .inp { font-size: 16px !important; } }

    /* ── Buttons ───────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 8px 16px; border-radius: var(--r-sm); font-size: 13px; font-weight: 600;
      font-family: inherit; border: 1px solid var(--border2); background: var(--s2);
      color: var(--text); cursor: pointer; transition: background .15s, border-color .15s;
      white-space: nowrap;
    }
    .btn:hover { background: var(--s3); }
    .btn.active-blue  { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.active-pink  { background: #be185d; border-color: #be185d; color: #fff; }
    .btn.active-blue:hover  { background: #4e51e0; }
    .btn.active-pink:hover  { background: #9d174d; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover { background: #4e51e0; }
    .btn:disabled { opacity: 0.38; cursor: default; }
    @media (max-width: 640px) { .btn { min-height: 38px; } }

    /* ── Toggle pill ───────────────────────── */
    .toggle-pill {
      display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px;
      border-radius: 20px; font-size: 12px; font-weight: 600; font-family: inherit;
      border: 1px solid var(--border2); background: transparent; color: var(--muted);
      cursor: pointer; transition: all .15s;
    }
    .toggle-pill.on { background: rgba(255,255,255,0.1); color: var(--text); border-color: var(--border2); }

    /* ── Tabs ──────────────────────────────── */
    .tab-bar { display: flex; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .tab-bar::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex: 1; min-width: 52px; padding: 12px 8px; display: flex; flex-direction: column;
      align-items: center; gap: 3px; font-size: 10px; font-weight: 600; font-family: inherit;
      color: var(--muted); border: none; border-bottom: 2px solid transparent;
      background: transparent; cursor: pointer; transition: color .15s, border-color .15s;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--text); }
    @media (min-width: 640px) {
      .tab-btn { flex-direction: row; gap: 6px; font-size: 11px; min-width: auto; padding: 13px 16px; }
    }

    /* ── Type badge ────────────────────────── */
    .tbadge {
      display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 20px;
      font-size: 11px; font-weight: 600; text-transform: capitalize; letter-spacing: 0.01em;
    }
    .tbadge.lg { padding: 4px 12px; font-size: 12px; }

    /* ── Stat bar ──────────────────────────── */
    .sbar { height: 6px; border-radius: 99px; background: var(--s3); overflow: hidden; }
    .sbar-fill { height: 100%; border-radius: 99px; transition: width .7s cubic-bezier(.4,0,.2,1); }

    /* ── Range slider ──────────────────────── */
    .slider { -webkit-appearance: none; appearance: none; height: 5px; border-radius: 3px; outline: none; cursor: pointer; width: 100%; }
    .slider::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.5); cursor: pointer; }
    .slider::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: none; box-shadow: 0 1px 4px rgba(0,0,0,0.5); cursor: pointer; }

    /* ── Pokémon image ─────────────────────── */
    .pimg { filter: drop-shadow(0 6px 16px rgba(0,0,0,0.55)); transition: transform .25s ease; }
    .pimg:hover { transform: scale(1.04) translateY(-2px); }
    .glow-shiny    { filter: drop-shadow(0 0 16px rgba(251,191,36,.8)) drop-shadow(0 6px 16px rgba(0,0,0,.5)); }
    .glow-shadow   { filter: drop-shadow(0 0 14px rgba(109,40,217,.8)) drop-shadow(0 6px 16px rgba(0,0,0,.5)); }
    .glow-purified { filter: drop-shadow(0 0 12px rgba(6,182,212,.65)) drop-shadow(0 6px 16px rgba(0,0,0,.5)); }

    /* ── Dex grid ──────────────────────────── */
    .dex-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
    @media (min-width: 400px) { .dex-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; } }
    @media (min-width: 768px) { .dex-grid { grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 9px; } }

    .dex-card {
      background: var(--s2); border: 1px solid var(--border); border-radius: var(--r-sm);
      padding: 8px 5px; display: flex; flex-direction: column; align-items: center; gap: 4px;
      cursor: pointer; transition: background .15s, border-color .15s;
    }
    .dex-card:hover { background: var(--s3); border-color: var(--border2); }
    .dex-card.sel { border-color: var(--accent); background: rgba(91,94,244,.12); }

    /* ── Utilities ─────────────────────────── */
    .fade-in  { animation: fadeIn  .25s ease-out; }
    .slide-up { animation: slideUp .28s cubic-bezier(.4,0,.2,1); }
    @keyframes fadeIn  { from{opacity:0}             to{opacity:1} }
    @keyframes slideUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    .spin { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .divider { height: 1px; background: var(--border); margin: 4px 0; }
    .section-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
    .search-dd { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: rgba(20,20,30,.98); border: 1px solid var(--border2); border-radius: var(--r-md); z-index: 999; max-height: 55vh; overflow-y: auto; box-shadow: 0 12px 40px rgba(0,0,0,.6); backdrop-filter: blur(12px); }
    .overflow-x-auto { overflow-x: auto; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 14px); }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: center; }
    @media (max-width: 480px) { .tbl th, .tbl td { padding: 5px 5px !important; font-size: 11px !important; } }
    /* ── Responsive layout ─────────────────── */
    .header-mobile  { display: flex; flex-direction: column; gap: 8px; }
    .header-desktop { display: none; }
    .layout-main    { display: flex; flex-direction: column-reverse; gap: 14px; }
    .dex-sidebar    { width: 100%; }
    .detail-panel   { width: 100%; }
    .compare-grid   { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 480px) { .compare-grid { grid-template-columns: 1fr; } }
    @media (min-width: 640px) {
      .header-mobile  { display: none; }
      .header-desktop { display: flex; align-items: center; gap: 16px; }
    }
    @media (min-width: 1024px) {
      .layout-main  { display: grid; grid-template-columns: 320px 1fr; gap: 24px; flex-direction: unset; }
      .dex-sidebar  { grid-column: 1; }
      .detail-panel { grid-column: 2; }
    }
    .dex-toggle-hint-mobile  { display: inline; }
    .dex-toggle-hint-desktop { display: none; }
    @media (min-width: 1024px) {
      .dex-toggle-hint-mobile  { display: none; }
      .dex-toggle-hint-desktop { display: inline; }
      .dex-always-show { display: block !important; }
    }
  </style>
</head>

<script type="text/babel">

const WEATHER = {sunny:{label:'☀️ Sunny',types:['fire','grass','ground']},rainy:{label:'🌧 Rainy',types:['water','electric','bug']},partlyCloudy:{label:'⛅ Partly Cloudy',types:['normal','rock']},cloudy:{label:'☁️ Cloudy',types:['fairy','fighting','poison']},windy:{label:'💨 Windy',types:['dragon','flying','psychic']},snowy:{label:'❄️ Snow',types:['ice','steel']},foggy:{label:'🌫 Foggy',types:['dark','ghost']}};

const COUNTERS=[{name:'mewtwo',types:['psychic'],move:'psychic'},{name:'rayquaza',types:['dragon','flying'],move:'dragon'},{name:'garchomp',types:['dragon','ground'],move:'dragon'},{name:'dragonite',types:['dragon','flying'],move:'dragon'},{name:'salamence',types:['dragon','flying'],move:'dragon'},{name:'dialga',types:['steel','dragon'],move:'dragon'},{name:'palkia',types:['water','dragon'],move:'dragon'},{name:'zekrom',types:['dragon','electric'],move:'electric'},{name:'reshiram',types:['dragon','fire'],move:'fire'},{name:'kyurem',types:['dragon','ice'],move:'ice'},{name:'tyranitar',types:['rock','dark'],move:'rock'},{name:'rampardos',types:['rock'],move:'rock'},{name:'rhyperior',types:['ground','rock'],move:'rock'},{name:'terrakion',types:['rock','fighting'],move:'rock'},{name:'nihilego',types:['rock','poison'],move:'rock'},{name:'machamp',types:['fighting'],move:'fighting'},{name:'lucario',types:['fighting','steel'],move:'fighting'},{name:'conkeldurr',types:['fighting'],move:'fighting'},{name:'keldeo',types:['water','fighting'],move:'fighting'},{name:'blaziken',types:['fire','fighting'],move:'fighting'},{name:'chandelure',types:['ghost','fire'],move:'ghost'},{name:'gengar',types:['ghost','poison'],move:'ghost'},{name:'giratina-origin',types:['ghost','dragon'],move:'ghost'},{name:'darkrai',types:['dark'],move:'dark'},{name:'weavile',types:['dark','ice'],move:'dark'},{name:'hydreigon',types:['dark','dragon'],move:'dark'},{name:'yveltal',types:['dark','flying'],move:'dark'},{name:'kyogre',types:['water'],move:'water'},{name:'swampert',types:['water','ground'],move:'water'},{name:'greninja',types:['water','dark'],move:'water'},{name:'raikou',types:['electric'],move:'electric'},{name:'electivire',types:['electric'],move:'electric'},{name:'zapdos',types:['electric','flying'],move:'electric'},{name:'moltres',types:['fire','flying'],move:'fire'},{name:'charizard',types:['fire','flying'],move:'fire'},{name:'entei',types:['fire'],move:'fire'},{name:'mamoswine',types:['ice','ground'],move:'ice'},{name:'glaceon',types:['ice'],move:'ice'},{name:'articuno',types:['ice','flying'],move:'ice'},{name:'roserade',types:['grass','poison'],move:'grass'},{name:'tangrowth',types:['grass'],move:'grass'},{name:'venusaur',types:['grass','poison'],move:'grass'},{name:'excadrill',types:['ground','steel'],move:'ground'},{name:'groudon',types:['ground'],move:'ground'},{name:'landorus-therian',types:['ground','flying'],move:'ground'},{name:'metagross',types:['steel','psychic'],move:'steel'},{name:'melmetal',types:['steel'],move:'steel'},{name:'genesect',types:['bug','steel'],move:'bug'},{name:'scizor',types:['bug','steel'],move:'bug'},{name:'alakazam',types:['psychic'],move:'psychic'},{name:'espeon',types:['psychic'],move:'psychic'},{name:'latios',types:['dragon','psychic'],move:'psychic'},{name:'togekiss',types:['fairy','flying'],move:'fairy'},{name:'gardevoir',types:['psychic','fairy'],move:'fairy'},{name:'sylveon',types:['fairy'],move:'fairy'},{name:'xerneas',types:['fairy'],move:'fairy'}];

// ── UTILS ─────────────────────────────────────────────────────────────────
const calcCP = (a,d,h,aIV,dIV,hIV,lv) => Math.max(10,Math.floor((a+aIV)*Math.pow(d+dIV,.5)*Math.pow(h+hIV,.5)*(CPM[lv]||.79)**2/10));
const calcHP = (h,hIV,lv) => Math.max(10,Math.floor((h+hIV)*(CPM[lv]||.79)));
const cap = s => s?s[0].toUpperCase()+s.slice(1):'';
const padId = id => String(id).padStart(4,'0');
const idFromUrl = url => { const m=url.match(/\/(\d+)\/$/); return m?parseInt(m[1]):0; };

function goStats(poke) {
  const s={}; poke.stats.forEach(x=>s[x.stat.name]=x.base_stat);
  return {
    atk: Math.max(1,Math.round((s.attack+s['special-attack'])*.875+s.speed*.125)),
    def: Math.max(1,Math.round((s.defense+s['special-defense'])*.875+s.speed*.125)),
    hp:  Math.max(1,Math.floor(s.hp*1.75+50)),
    raw: s,
  };
}

function typeWeaknesses(types) {
  const eff={};
  types.forEach(t=>Object.entries(TYPE_EFF[t]||{}).forEach(([at,m])=>{ eff[at]=(eff[at]||1)*m; }));
  const weak=[],resist=[],immune=[];
  Object.entries(eff).forEach(([t,m])=>{
    if(m>=2) weak.push({t,m}); else if(m===0) immune.push({t}); else if(m<1) resist.push({t,m});
  });
  return {weak,resist,immune};
}

function weatherForTypes(types) {
  return Object.values(WEATHER).filter(w=>types.some(t=>w.types.includes(t))).map(w=>w.label);
}

function typeEffVs(attackType,defTypes) {
  let m=1; defTypes.forEach(dt=>{m*=(TYPE_EFF[dt]||{})[attackType]??1;}); return m;
}

function scoredCounters(defTypes) {
  const seen=new Set(),out=[];
  for(const c of COUNTERS){
    if(seen.has(c.name)) continue; seen.add(c.name);
    let best=0,bestT='';
    for(const t of [c.move,...c.types]){if(!t) continue; const e=typeEffVs(t,defTypes); if(e>best){best=e;bestT=t;}}
    if(best>=1.6) out.push({...c,eff:best,bestMoveType:bestT});
  }
  out.sort((a,b)=>b.eff-a.eff); return out.slice(0,10);
}

function reverseLookup(gs,target) {
  const rows=[]; const lvs=Object.keys(CPM).map(Number).sort((a,b)=>a-b);
  for(const lv of lvs) for(let a=0;a<=15;a++) for(let d=0;d<=15;d++) for(let h=0;h<=15;h++)
    if(calcCP(gs.atk,gs.def,gs.hp,a,d,h,lv)===target)
      rows.push({lv,a,d,h,pct:Math.round(((a+d+h)/45)*100)});
  return rows;
}

  if(name.includes('-alola'))   return {tag:'Alolan',   c:'#d97706'};
  if(name.includes('-galar'))   return {tag:'Galarian',  c:'#db2777'};
  if(name.includes('-hisui'))   return {tag:'Hisuian',   c:'#65a30d'};
  if(name.includes('-paldea'))  return {tag:'Paldean',   c:'#ea580c'};
  if(name.includes('-mega'))    return {tag:'Mega',      c:'#4f46e5'};
  if(name.includes('-gmax'))    return {tag:'G-Max',     c:'#dc2626'};
  if(name.includes('-primal'))  return {tag:'Primal',    c:'#b91c1c'};
  if(name.includes('-origin'))  return {tag:'Origin',    c:'#7c3aed'};
  if(name.includes('-therian')) return {tag:'Therian',   c:'#0d9488'};
  return null;
}

function fmtName(name) {
  return name
    .replace(/-mega-([xy])$/,(_,c)=>` Mega ${c.toUpperCase()}`)
    .replace(/-mega$/,' Mega').replace(/-gmax$/,' G-Max')
    .replace(/-alola$/,' (Alolan)').replace(/-galar$/,' (Galarian)')
    .replace(/-hisui$/,' (Hisuian)').replace(/-paldea$/,' (Paldean)')
    .replace(/-primal$/,' (Primal)').replace(/-origin$/,' (Origin)')
    .replace(/-therian$/,' (Therian)')
    .split('-').map(w=>w[0].toUpperCase()+w.slice(1)).join(' ');
}

// ── API ────────────────────────────────────────────────────────────────────
const cache={};
const fetchPoke    = async k => { k=String(k).toLowerCase(); if(cache[k]) return cache[k]; const r=await fetch(`https://pokeapi.co/api/v2/pokemon/${k}`); if(!r.ok) throw new Error(); return cache[k]=await r.json(); };
const fetchSpecies = async k => { const ck=`sp_${k}`; if(cache[ck]) return cache[ck]; const r=await fetch(`https://pokeapi.co/api/v2/pokemon-species/${k}`); if(!r.ok) return null; return cache[ck]=await r.json(); };
const fetchEvoChain= async u => { if(cache[u]) return cache[u]; const r=await fetch(u); if(!r.ok) return null; return cache[u]=await r.json(); };

async function fetchList() {
  if(cache._list) return cache._list;
  const r=await fetch('https://pokeapi.co/api/v2/pokemon?limit=2000&offset=0');
  const data=await r.json();
  const list=data.results.map(p=>{ const id=idFromUrl(p.url); return{name:p.name,id,dn:fmtName(p.name),tag:getFormTag(p.name),sid:id,virtual:false}; });
  SHADOW_IDS.forEach(id=>{
    const base=list.find(p=>p.id===id&&!p.name.includes('-'));
    if(!base) return;
    list.push({name:base.name+'-shadow',  id,dn:fmtName(base.name)+' (Shadow)',  tag:{tag:'Shadow',  c:'#7c3aed'},sid:id,virtual:true,shadowType:'shadow',  baseName:base.name});
    list.push({name:base.name+'-purified',id,dn:fmtName(base.name)+' (Purified)',tag:{tag:'Purified',c:'#0891b2'},sid:id,virtual:true,shadowType:'purified',baseName:base.name});
  });
  return cache._list=list;
}

    let l=all;

    if(gen!=='all'){const g=GENS.find(x=>x.label===gen); if(g) l=l.filter(p=>p.id>=g.min&&p.id<=g.max);}

// ── CP CALCULATOR ──────────────────────────────────────────────────────────
function CPCalc({poke}) {
  const gs=React.useMemo(()=>poke?goStats(poke):null,[poke]);
  const [tab,setTab]=React.useState('calc');
  const [lv,setLv]=React.useState(40);
  const [aIV,setAIV]=React.useState(15);
  const [dIV,setDIV]=React.useState(15);
  const [hIV,setHIV]=React.useState(15);
  const [cpIn,setCpIn]=React.useState('');
  const [lvIn,setLvIn]=React.useState('');
  const [res,setRes]=React.useState(null);
  const [busy,setBusy]=React.useState(false);
  const cp=React.useMemo(()=>gs?calcCP(gs.atk,gs.def,gs.hp,aIV,dIV,hIV,lv):0,[gs,lv,aIV,dIV,hIV]);
  const hp=React.useMemo(()=>gs?calcHP(gs.hp,hIV,lv):0,[gs,hIV,lv]);
  const maxCP=React.useMemo(()=>gs?calcCP(gs.atk,gs.def,gs.hp,15,15,15,50):0,[gs]);
  const pct=maxCP>0?Math.min(100,(cp/maxCP)*100):0;
  const ivColor=p=>p===100?'#fbbf24':p>=98?'#4ade80':p>=93?'#60a5fa':p>=82?'#a78bfa':'var(--muted)';
  const doLookup=()=>{
    const t=parseInt(cpIn); if(!gs||!t||t<10) return;
    setBusy(true); setRes(null);
    setTimeout(()=>{
      let r=reverseLookup(gs,t);
      if(lvIn){const lv=parseFloat(lvIn);r=r.filter(x=>x.lv===lv);}
      r.sort((a,b)=>b.pct-a.pct); setRes(r); setBusy(false);
    },10);
  };
  if(!poke) return <div style={{padding:'40px 0',textAlign:'center',color:'var(--dim)',fontSize:13}}>Select a Pokémon first</div>;
  return (
    <div className="slide-up" style={{display:'flex',flexDirection:'column',gap:12}}>
      {/* Mode toggle */}
      <div style={{display:'flex',borderRadius:10,overflow:'hidden',border:'1px solid var(--border2)'}}>
        {[['calc','⚡ Calculate'],['lookup','🔍 CP → IVs']].map(([id,l])=>(
          <button key={id} onClick={()=>setTab(id)} style={{flex:1,padding:'9px 12px',fontSize:13,fontWeight:600,fontFamily:'inherit',border:'none',cursor:'pointer',transition:'background .15s, color .15s',
            background:tab===id?'var(--s3)':'transparent',color:tab===id?'var(--text)':'var(--muted)'}}>
            {l}
          </button>
        ))}
      </div>

      {tab==='calc'&&(<>
        {/* CP display */}
        <div className="card2" style={{padding:'20px 16px',textAlign:'center',borderColor:'rgba(99,102,241,.25)'}}>
          <div style={{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',color:'var(--muted)',marginBottom:6}}>Combat Power</div>
          <div style={{fontSize:52,fontWeight:800,lineHeight:1,letterSpacing:'-.03em',color:'var(--text)'}}>{cp.toLocaleString()}</div>
          <div style={{height:5,borderRadius:99,background:'var(--s3)',margin:'12px auto',maxWidth:240,overflow:'hidden'}}>
            <div style={{height:'100%',borderRadius:99,background:'linear-gradient(90deg,var(--accent),#a78bfa)',width:`${pct}%`,transition:'width .6s cubic-bezier(.4,0,.2,1)'}}/>
          </div>
          <div style={{fontSize:11,color:'var(--dim)'}}>{pct.toFixed(1)}% of max {maxCP.toLocaleString()}</div>
        </div>
        {/* ATK / DEF / HP */}
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8}}>
          {[['Attack',gs.atk+aIV,'#f87171'],['Defense',gs.def+dIV,'#60a5fa'],['HP',hp,'#4ade80']].map(([l,v,c])=>(
            <div key={l} className="card3" style={{padding:'8px 6px',textAlign:'center'}}>
              <div style={{fontSize:10,fontWeight:600,color:c,marginBottom:2}}>{l}</div>
              <div style={{fontSize:17,fontWeight:800}}>{v}</div>
            </div>
          ))}
        </div>
        <RangeSlider label="Level" value={lv} onChange={setLv} min={1} max={50} step={0.5} color="var(--accent)" showNum/>
        <IVSlider label="Attack IV"  value={aIV} onChange={setAIV} color="#f87171"/>
        <IVSlider label="Defense IV" value={dIV} onChange={setDIV} color="#60a5fa"/>
        <IVSlider label="HP IV"      value={hIV} onChange={setHIV} color="#4ade80"/>
      </>)}

      {tab==='lookup'&&(
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          <p style={{fontSize:13,color:'var(--muted)',lineHeight:1.5}}>Enter a CP and optionally a level to see every IV combination that matches.</p>
          <div className="card2" style={{padding:'14px 16px',display:'flex',flexDirection:'column',gap:10}}>
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              <div>
                <label style={{fontSize:11,fontWeight:600,color:'var(--muted)',display:'block',marginBottom:4}}>CP Value</label>
                <input className="inp" type="number" value={cpIn} onChange={e=>setCpIn(e.target.value)} onKeyDown={e=>e.key==='Enter'&&doLookup()} placeholder="e.g. 2532"/>
              </div>
              <div>
                <label style={{fontSize:11,fontWeight:600,color:'var(--muted)',display:'block',marginBottom:4}}>Level (optional)</label>
                <input className="inp" type="number" value={lvIn} onChange={e=>setLvIn(e.target.value)} placeholder="e.g. 20" min="1" max="50" step="0.5"/>
              </div>
            </div>
            <button className="btn primary" onClick={doLookup} disabled={!cpIn||busy} style={{width:'100%',justifyContent:'center',padding:'10px 16px',fontSize:13}}>
              {busy?'Searching…':'Find IV Combinations'}
            </button>
          </div>
          {busy&&<div style={{display:'flex',justifyContent:'center',padding:24}}><Spinner/></div>}
          {res!==null&&!busy&&(
            <div className="card2" style={{overflow:'hidden'}}>
              {res.length===0?(
                <div style={{padding:24,textAlign:'center',color:'var(--muted)',fontSize:13}}>
                  No combinations found for CP {cpIn}{lvIn?` at level ${lvIn}`:''}.
                </div>
              ):(
                <>
                  <div style={{padding:'10px 14px',borderBottom:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center',background:'var(--s3)'}}>
                    <span style={{fontSize:13,fontWeight:700}}>CP {cpIn} → {res.length} result{res.length!==1?'s':''}</span>
                    <span style={{fontSize:11,color:'var(--muted)'}}>by IV%</span>
                  </div>
                  <div className="overflow-x-auto">
                    <table className="tbl" style={{fontSize:12}}>
                      <thead><tr style={{background:'var(--s3)'}}>
                        {['Lv','IV%','ATK','DEF','HP','HP (in-game)'].map(h=><th key={h} style={{padding:'8px 10px',fontWeight:600,color:'var(--muted)',fontSize:11}}>{h}</th>)}
                      </tr></thead>
                      <tbody>
                        {res.map((r,i)=>{
                          const isH=r.a===15&&r.d===15&&r.h===15;
                          return (<tr key={i} style={{borderTop:'1px solid var(--border)',background:isH?'rgba(251,191,36,.07)':''}}>
                            <td style={{padding:'7px 10px',fontWeight:600,color:'var(--muted)'}}>{r.lv}</td>
                            <td style={{padding:'7px 10px',fontWeight:700,color:ivColor(r.pct)}}>{isH?'⭐':''}{r.pct}%</td>
                            <td style={{padding:'7px 10px',fontWeight:700,color:r.a===15?'#f87171':r.a>=13?'#fca5a5':'var(--muted)'}}>{r.a}</td>
                            <td style={{padding:'7px 10px',fontWeight:700,color:r.d===15?'#60a5fa':r.d>=13?'#93c5fd':'var(--muted)'}}>{r.d}</td>
                            <td style={{padding:'7px 10px',fontWeight:700,color:r.h===15?'#4ade80':r.h>=13?'#86efac':'var(--muted)'}}>{r.h}</td>
                            <td style={{padding:'7px 10px',color:'#4ade80',fontWeight:600}}>{calcHP(gs.hp,r.h,r.lv)}</td>
                          </tr>);
                        })}
                      </tbody>
                    </table>
                  </div>
                </>
              )}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ── IV CHART ───────────────────────────────────────────────────────────────
function IVChart({poke}) {
  const gs=React.useMemo(()=>poke?goStats(poke):null,[poke]);
  const [lv,setLv]=React.useState(40);
  const [minCP,setMinCP]=React.useState('');
  const [maxCP,setMaxCP]=React.useState('');
  const [ivf,setIvf]=React.useState('all');
  const [sort,setSort]=React.useState('iv');
  const [top,setTop]=React.useState(50);
  const all=React.useMemo(()=>{
    if(!gs) return [];
    const rows=[];
    for(let a=15;a>=0;a--) for(let d=15;d>=0;d--) for(let h=15;h>=0;h--)
      rows.push({a,d,h,cp:calcCP(gs.atk,gs.def,gs.hp,a,d,h,lv),hp:calcHP(gs.hp,h,lv),pct:Math.round(((a+d+h)/45)*100)});
    return rows;
  },[gs,lv]);
  const rows=React.useMemo(()=>{
    let r=all;
    const lo=parseInt(minCP)||0,hi=parseInt(maxCP)||Infinity;
    if(lo||hi<Infinity) r=r.filter(x=>x.cp>=lo&&x.cp<=hi);
    if(ivf==='hundo') r=r.filter(x=>x.a===15&&x.d===15&&x.h===15);
    else if(ivf==='lucky') r=r.filter(x=>x.a>=12&&x.d>=12&&x.h>=12);
    else if(ivf==='98') r=r.filter(x=>x.pct>=98);
    else if(ivf==='82') r=r.filter(x=>x.pct>=82);
    const km={iv:'pct',cp:'cp',atk:'a',def:'d',hp:'h'};
    r=[...r].sort((a,b)=>b[km[sort]||'pct']-a[km[sort]||'pct']);
    return r.slice(0,top);
  },[all,minCP,maxCP,ivf,sort,top]);
  const maxCP50=gs?calcCP(gs.atk,gs.def,gs.hp,15,15,15,50):0;
  const ivStyle=p=>p===100?'#fbbf24':p>=98?'#4ade80':p>=93?'#60a5fa':p>=82?'#a78bfa':'var(--muted)';
  const ivBg=p=>p===100?'rgba(251,191,36,.12)':p>=98?'rgba(74,222,128,.08)':p>=93?'rgba(96,165,250,.08)':p>=82?'rgba(167,139,250,.06)':'';
  if(!poke) return <div style={{padding:'40px 0',textAlign:'center',color:'var(--dim)',fontSize:13}}>Select a Pokémon first</div>;
  return (
    <div className="slide-up" style={{display:'flex',flexDirection:'column',gap:12}}>
      <RangeSlider label="Level" value={lv} onChange={setLv} min={1} max={50} step={0.5} color="var(--accent)" showNum/>
      {/* CP filter */}
      <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
        <input className="inp" type="number" value={minCP} onChange={e=>setMinCP(e.target.value)} placeholder="Min CP" style={{flex:1,minWidth:0,maxWidth:110}}/>
        <span style={{color:'var(--dim)',fontSize:13}}>–</span>
        <input className="inp" type="number" value={maxCP} onChange={e=>setMaxCP(e.target.value)} placeholder="Max CP" style={{flex:1,minWidth:0,maxWidth:110}}/>
        {(minCP||maxCP)&&<button className="btn" style={{padding:'7px 10px',fontSize:12}} onClick={()=>{setMinCP('');setMaxCP('');}}>✕</button>}
        <span style={{fontSize:11,color:'var(--dim)',marginLeft:'auto'}}>Max: {maxCP50.toLocaleString()}</span>
      </div>
      {/* IV filter pills */}
      <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
        {[['All','all','var(--muted)'],['⭐ Hundo','hundo','#fbbf24'],['Lucky (12+)','lucky','#4ade80'],['≥98%','98','#60a5fa'],['≥82%','82','#a78bfa']].map(([l,v,c])=>(
          <button key={v} onClick={()=>setIvf(v)} style={{padding:'4px 11px',borderRadius:20,fontSize:12,fontWeight:600,fontFamily:'inherit',cursor:'pointer',border:`1px solid ${ivf===v?c:'var(--border2)'}`,background:ivf===v?c+'22':'transparent',color:ivf===v?c:'var(--muted)',transition:'all .15s'}}>{l}</button>
        ))}
      </div>
      {/* Sort */}
      <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
        <span style={{fontSize:11,color:'var(--dim)'}}>Sort by</span>
        {[['IV%','iv'],['CP','cp'],['ATK','atk'],['DEF','def'],['HP','hp']].map(([l,v])=>(
          <button key={v} className={`btn${sort===v?' active-blue':''}`} style={{padding:'4px 10px',fontSize:11}} onClick={()=>setSort(v)}>{l}</button>
        ))}
        <span style={{fontSize:11,color:'var(--dim)',marginLeft:'auto'}}>{rows.length} of {all.length.toLocaleString()}</span>
      </div>
      {/* Table */}
      <div className="card2" style={{overflow:'hidden'}}>
        <div className="overflow-x-auto">
          <table className="tbl" style={{fontSize:12,minWidth:300}}>
            <thead><tr style={{background:'var(--s3)'}}>
              {['#','IV%','ATK','DEF','HP','CP','HP'].map(h=><th key={h} style={{padding:'8px 10px',fontWeight:600,color:'var(--muted)',fontSize:11}}>{h}</th>)}
            </tr></thead>
            <tbody>
              {rows.map((row,i)=>{
                const isH=row.a===15&&row.d===15&&row.h===15;
                return (<tr key={`${row.a}-${row.d}-${row.h}`} style={{borderTop:'1px solid var(--border)',background:ivBg(row.pct)}}>
                  <td style={{padding:'6px 10px',color:'var(--dim)'}}>{i+1}</td>
                  <td style={{padding:'6px 10px',fontWeight:700,color:ivStyle(row.pct)}}>{isH?'⭐':''}{row.pct}%</td>
                  <td style={{padding:'6px 10px',fontWeight:700,color:row.a===15?'#f87171':row.a>=13?'#fca5a5':'var(--muted)'}}>{row.a}</td>
                  <td style={{padding:'6px 10px',fontWeight:700,color:row.d===15?'#60a5fa':row.d>=13?'#93c5fd':'var(--muted)'}}>{row.d}</td>
                  <td style={{padding:'6px 10px',fontWeight:700,color:row.h===15?'#4ade80':row.h>=13?'#86efac':'var(--muted)'}}>{row.h}</td>
                  <td style={{padding:'6px 10px',fontWeight:700,color:'var(--text)'}}>{row.cp.toLocaleString()}</td>
                  <td style={{padding:'6px 10px',color:'#4ade80',fontWeight:600}}>{row.hp}</td>
                </tr>);
              })}
            </tbody>
          </table>
          {rows.length===0&&<div style={{padding:24,textAlign:'center',color:'var(--dim)',fontSize:13}}>No results</div>}
        </div>
      </div>
      {top<all.length&&<button className="btn" style={{width:'100%',justifyContent:'center',padding:'9px',fontSize:13}} onClick={()=>setTop(t=>t+100)}>Show more ({all.length-top} remaining)</button>}
    </div>
  );
}

// ── RAID IV CHART ──────────────────────────────────────────────────────────
function RaidIVChart({poke}) {
  const gs=React.useMemo(()=>poke?goStats(poke):null,[poke]);
  const types=poke?.types?.map(t=>t.type.name)||[];
  const weathers=React.useMemo(()=>weatherForTypes(types),[types.join(',')]);
  const [encKey,setEncKey]=React.useState('raid');
  const [minCP,setMinCP]=React.useState('');
  const [maxCP,setMaxCP]=React.useState('');
  const [ivf,setIvf]=React.useState('all');
  const [sort,setSort]=React.useState('iv');
  const [top,setTop]=React.useState(50);
  const enc=ENC[encKey];
  const all=React.useMemo(()=>{
    if(!gs) return [];
    const rows=[];
    for(let a=15;a>=enc.fl;a--) for(let d=15;d>=enc.fl;d--) for(let h=15;h>=enc.fl;h--)
      rows.push({a,d,h,cpN:calcCP(gs.atk,gs.def,gs.hp,a,d,h,enc.lv),cpB:enc.boosted?calcCP(gs.atk,gs.def,gs.hp,a,d,h,enc.blv):null,hpN:calcHP(gs.hp,h,enc.lv),pct:Math.round(((a+d+h)/45)*100)});
    return rows;
  },[gs,encKey]);
  const rows=React.useMemo(()=>{
    let r=all;
    const lo=parseInt(minCP)||0,hi=parseInt(maxCP)||Infinity;
    if(lo||hi<Infinity) r=r.filter(x=>(enc.boosted?[x.cpN,x.cpB]:[x.cpN]).some(v=>v>=lo&&v<=hi));
    if(ivf==='hundo') r=r.filter(x=>x.a===15&&x.d===15&&x.h===15);
    else if(ivf==='lucky') r=r.filter(x=>x.a>=12&&x.d>=12&&x.h>=12);
    else if(ivf==='98') r=r.filter(x=>x.pct>=98);
    const km={iv:'pct',cp:'cpN',atk:'a',def:'d',hp:'h'};
    r=[...r].sort((a,b)=>b[km[sort]||'pct']-a[km[sort]||'pct']);
    return r.slice(0,top);
  },[all,minCP,maxCP,ivf,sort,top]);
  const ivStyle=p=>p===100?'#fbbf24':p>=98?'#4ade80':p>=93?'#60a5fa':p>=82?'#a78bfa':'var(--muted)';

  const hundoB=gs&&enc.boosted?calcCP(gs.atk,gs.def,gs.hp,15,15,15,enc.blv):0;
  if(!poke) return <div style={{padding:'40px 0',textAlign:'center',color:'var(--dim)',fontSize:13}}>Select a Pokémon first</div>;

function EvoArrow({detail}) {

    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'0 4px',minWidth:44,flexShrink:0}}>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent-light)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M5 12h14M13 6l6 6-6 6"/>

    </div>

function parseEvo(chain) {
  const stages=[];
  const walk=(node,s)=>{
    if(!stages[s]) stages[s]=[];
    const det=node.evolution_details?.[0]; let req='';
    if(det){
      if(det.min_level) req=`Lv.${det.min_level}`;
      else if(det.item) req=cap(det.item.name.replace(/-/g,' '));
      else if(det.held_item) req=cap(det.held_item.name.replace(/-/g,' '));
      else if(det.trigger?.name==='trade') req='Trade';
      else if(det.min_happiness) req=`Happy(${det.min_happiness})`;
      else req=cap((det.trigger?.name||'').replace(/-/g,' '));
    }
    stages[s].push({name:node.species.name,req});
    node.evolves_to.forEach(n=>walk(n,s+1));
  };
  walk(chain,0); return stages;
}

function EvoChain({speciesName,isShiny,is3D,onSelect,activeName}) {
  const [stages,setStages]=React.useState(null);
  const [loading,setLoading]=React.useState(false);
  React.useEffect(()=>{
    if(!speciesName) return;
    setLoading(true); setStages(null);
    fetchSpecies(speciesName)
      .then(sp=>sp?fetchEvoChain(sp.evolution_chain.url):null)
      .then(chain=>{ if(chain) setStages(parseEvo(chain.chain)); })
      .catch(()=>{}).finally(()=>setLoading(false));
  },[speciesName]);
  if(loading) return <div style={{display:'flex',justifyContent:'center',padding:20}}><Spinner/></div>;
  if(!stages) return null;
  if(stages.length<=1&&stages[0]?.length<=1) return <div style={{padding:'12px 0',textAlign:'center',color:'var(--dim)',fontSize:13}}>No evolutions</div>;
  return (
    <div style={{display:'flex',flexWrap:'wrap',alignItems:'center',justifyContent:'center',gap:4,padding:'8px 0',overflowX:'auto'}}>
      {stages.map((stage,si)=>(
        <React.Fragment key={si}>
          {si>0&&(
            <div style={{display:'flex',flexDirection:'column',gap:4}}>
              {stage.some(n=>n.req)?stage.map(n=>n.req&&<EvoArrow key={n.name} detail={n.req}/>):<EvoArrow detail=""/>}
            </div>
          )}
          <div style={{display:'flex',flexDirection:'column',gap:4}}>
            {stage.map(n=><EvoNode key={n.name} name={n.name} isShiny={isShiny} is3D={is3D} onSelect={onSelect} isActive={n.name===activeName}/>)}
          </div>
        </React.Fragment>
      ))}
    </div>
  );
}

  const [mode,setMode]         = React.useState('dex');
  const [showDex,setShowDex]   = React.useState(false);

  const typeColor = poke ? (TYPE_COLORS[poke.types[0].type.name]||'var(--accent)') : 'var(--accent)';

  const load=React.useCallback(async nameOrId=>{
    setLoading(true); setError(null); setIsShiny(false);
    let api=String(nameOrId).toLowerCase(), sh=null;
    if(api.endsWith('-shadow'))   {sh='shadow';   api=api.replace(/-shadow$/,'');}
    if(api.endsWith('-purified')) {sh='purified'; api=api.replace(/-purified$/,'');}
    try {
      const p=await fetchPoke(api);
      setPoke(p); setShadow(sh); setTab('info');
      const sp=await fetchSpecies(p.species?.name||p.name).catch(()=>null);
      setSpecies(sp);
    } catch {
      setError(`"${nameOrId}" not found. Try a name like "pikachu" or a number.`);
      setPoke(null); setSpecies(null); setShadow(null);
    } finally { setLoading(false); }
  },[]);

  React.useEffect(()=>{ load('mewtwo'); },[]);

  const TABS=[
    {id:'info',    label:'Info',      icon:<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>},
    {id:'cp',      label:'CP Calc',   icon:<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>},
    {id:'iv',      label:'IV Chart',  icon:<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>},
    {id:'raid',    label:'Raid IVs',  icon:<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>},
    {id:'counters',label:'Counters',  icon:<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>},
    {id:'evo',     label:'Evolution', icon:<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>},
  ];

  return (
    <div style={{minHeight:'100vh',background:'var(--bg)',color:'var(--text)'}}>

      {/* ── Header ─────────────────────────────────────── */}
      <header style={{background:'var(--s1)',borderBottom:'1px solid var(--border)',position:'sticky',top:0,zIndex:50}}>
        <div style={{maxWidth:1280,margin:'0 auto',padding:'10px 16px'}}>
          <div className="header-mobile">
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <Pokeball size={28}/>
              <span style={{fontWeight:800,fontSize:14,letterSpacing:'-.02em',flex:1}}>GO Dex</span>
              <button onClick={()=>setMode('dex')} className={`btn${mode==='dex'?' active-blue':''}`} style={{padding:'5px 12px',fontSize:11}}>Dex</button>
              <button onClick={()=>setMode('compare')} className={`btn${mode==='compare'?' active-pink':''}`} style={{padding:'5px 12px',fontSize:11}}>Compare</button>
            </div>
            <SearchBar onSelect={load}/>
          </div>
          <div className="header-desktop">
            <div style={{display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
              <Pokeball size={30}/>
              <div>
                <div style={{fontWeight:800,fontSize:13,letterSpacing:'-.02em',lineHeight:1.1}}>Pokémon GO</div>
                <div style={{fontSize:10,color:'var(--muted)',fontWeight:500,letterSpacing:'.05em',textTransform:'uppercase',marginTop:1}}>Dex &amp; CP Calc</div>
              </div>
            </div>
            <div style={{flex:1,maxWidth:440}}><SearchBar onSelect={load}/></div>
            <div style={{display:'flex',gap:8,flexShrink:0}}>
              <button onClick={()=>setMode('dex')} className={`btn${mode==='dex'?' active-blue':''}`}>Dex</button>
              <button onClick={()=>setMode('compare')} className={`btn${mode==='compare'?' active-pink':''}`}>Compare</button>
            </div>
          </div>
        </div>
      </header>

      {/* ── Content ───────────────────────────────────── */}
      {mode==='compare'?(
        <main style={{maxWidth:1000,margin:'0 auto',padding:'20px 16px 32px'}}>
          <div style={{marginBottom:16}}>
            <h2 style={{fontSize:18,fontWeight:800,letterSpacing:'-.02em'}}>Compare</h2>
            <p style={{fontSize:13,color:'var(--muted)',marginTop:3}}>Side-by-side GO stats and max CP</p>
          </div>
          <ComparePanel isShiny={isShiny} is3D={is3D}/>
        </main>
      ):(
        <main style={{maxWidth:1280,margin:'0 auto',padding:'16px 16px 32px'}}>
          <div className="layout-main">

            {/* ── Dex sidebar ── */}
            <div className="dex-sidebar">
              <div className="card" style={{padding:'14px'}}>
                <button onClick={()=>setShowDex(!showDex)}
                  style={{display:'flex',justifyContent:'space-between',alignItems:'center',width:'100%',background:'none',border:'none',cursor:'pointer',color:'var(--text)',padding:0,fontFamily:'inherit',marginBottom:showDex?12:0}}>
                  <span style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'.07em',color:'var(--muted)'}}>Pokédex</span>
                  <span className="dex-toggle-hint-mobile" style={{fontSize:11,color:'var(--muted)',padding:'3px 9px',borderRadius:6,background:'var(--s2)',border:'1px solid var(--border2)'}}>{showDex?'Hide ▲':'Browse ▼'}</span>
                  <span className="dex-toggle-hint-desktop" style={{fontSize:11,color:'var(--dim)'}}>scroll to browse</span>
                </button>
                <div style={{display:showDex?'block':'none'}} className="dex-always-show">
                  <DexGrid onSelect={n=>{load(n);setShowDex(false);}} activeName={poke?.name}/>
                </div>
              </div>
            </div>

            {/* ── Detail panel ── */}
            <div className="detail-panel" style={{display:'flex',flexDirection:'column',gap:12}}>
              {loading&&(
                <div className="card" style={{padding:'64px 20px',display:'flex',flexDirection:'column',alignItems:'center',gap:12}}>
                  <Spinner size="lg"/>
                  <span style={{color:'var(--muted)',fontSize:13}}>Loading…</span>
                </div>
              )}
              {error&&!loading&&(
                <div className="card" style={{padding:'40px 20px',textAlign:'center'}}>
                  <div style={{fontSize:36,marginBottom:12}}>🙁</div>
                  <div style={{fontWeight:600,color:'#f87171',fontSize:14,marginBottom:6}}>{error}</div>
                  <div style={{fontSize:12,color:'var(--muted)'}}>Try "charizard", "rayquaza", or a Pokédex number</div>
                </div>
              )}
              {poke&&!loading&&(<>
                <PokemonCard poke={poke} species={species} isShiny={isShiny} is3D={is3D} shadowType={shadow} onShiny={setIsShiny} on3D={setIs3D}/>
                <div className="card" style={{overflow:'hidden'}}>
                  <div className="tab-bar">
                    {TABS.map(t=>(
                      <button key={t.id} className={`tab-btn${tab===t.id?' active':''}`}
                        style={tab===t.id?{borderBottomColor:typeColor}:{}}
                        onClick={()=>setTab(t.id)}>
                        {t.icon}
                        <span>{t.label}</span>
                      </button>
                    ))}
                  </div>
                  <div style={{padding:'16px 14px'}}>
                    {tab==='info'&&     <DetailPanel  poke={poke} species={species}/>}
                    {tab==='cp'&&       <CPCalc       poke={poke}/>}
                    {tab==='iv'&&       <IVChart      poke={poke}/>}
                    {tab==='raid'&&     <RaidIVChart  poke={poke}/>}
                    {tab==='counters'&& <RaidCounters poke={poke}/>}
                    {tab==='evo'&&(
                      <div>
                        <div style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'.07em',color:'var(--muted)',marginBottom:12}}>Evolution Chain</div>
                        <EvoChain speciesName={poke.species?.name||poke.name} isShiny={isShiny} is3D={is3D} onSelect={load} activeName={poke.name}/>
                      </div>
                    )}
                  </div>
                </div>
              </>)}
              {!poke&&!loading&&!error&&(
                <div className="card" style={{padding:'64px 20px',display:'flex',flexDirection:'column',alignItems:'center',gap:12,textAlign:'center'}}>
                  <Pokeball size={48}/>
                  <div>
                    <h3 style={{fontSize:18,fontWeight:800,marginBottom:6}}>Pokémon GO Dex</h3>
                    <p style={{fontSize:13,color:'var(--muted)',maxWidth:280,lineHeight:1.6,margin:'0 auto'}}>Search for any Pokémon above, or tap Browse to open the Pokédex.</p>
                  </div>
                </div>
              )}
            </div>

          </div>
        </main>
      )}

      <footer style={{textAlign:'center',padding:'24px 16px',color:'var(--dim)',fontSize:11,borderTop:'1px solid var(--border)',marginTop:4}}>
        Data from <a href="https://pokeapi.co" target="_blank" rel="noopener" style={{color:'var(--accent-light)'}}>PokéAPI</a>
        {' · '}Not affiliated with Niantic or Nintendo
      </footer>
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
