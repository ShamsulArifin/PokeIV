// ===================== UTILITY FUNCTIONS =====================
function calcCP(baseAtk, baseDef, baseHP, atkIV, defIV, hpIV, level) {
  const cpm = CP_MULTIPLIERS[level] || 0.79030001;
  const cp = Math.floor((baseAtk + atkIV) * Math.pow(baseDef + defIV, 0.5) * Math.pow(baseHP + hpIV, 0.5) * Math.pow(cpm, 2) / 10);
  return Math.max(10, cp);
}

function calcHP(baseHP, hpIV, level) {
  const cpm = CP_MULTIPLIERS[level] || 0.79030001;
  return Math.max(10, Math.floor((baseHP + hpIV) * cpm));
}

function getTypeWeaknesses(types) {
  const effectiveness = {};
  types.forEach(type => {
    const defMap = TYPE_EFFECTIVENESS[type] || {};
    Object.entries(defMap).forEach(([attType, mult]) => {
      effectiveness[attType] = (effectiveness[attType] || 1) * mult;
    });
  });
  const weaknesses = [], resistances = [], immunities = [];
  Object.entries(effectiveness).forEach(([type, mult]) => {
    if (mult >= 2) weaknesses.push({type, mult});
    else if (mult === 0) immunities.push({type, mult});
    else if (mult < 1) resistances.push({type, mult});
  });
  return { weaknesses, resistances, immunities };
}

function capitalize(str) { return str ? str.charAt(0).toUpperCase() + str.slice(1) : ''; }
function padId(id) { return String(id).padStart(4, '0'); }

// ===================== API HELPERS =====================
const cache = {};
async function fetchPokemon(nameOrId) {
  const key = String(nameOrId).toLowerCase();
  if (cache[key]) return cache[key];
  const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${key}`);
  if (!res.ok) throw new Error('Not found');
  const data = await res.json();
  cache[key] = data;
  return data;
}

async function fetchSpecies(nameOrId) {
  const key = `species_${nameOrId}`;
  if (cache[key]) return cache[key];
  const res = await fetch(`https://pokeapi.co/api/v2/pokemon-species/${nameOrId}`);
  if (!res.ok) return null;
  const data = await res.json();
  cache[key] = data;
  return data;
}

async function fetchEvolutionChain(url) {
  if (cache[url]) return cache[url];
  const res = await fetch(url);
  if (!res.ok) return null;
  const data = await res.json();
  cache[url] = data;
  return data;
}

// Extract numeric dex ID from PokeAPI URL
function idFromUrl(url) {
  const m = url.match(/\/(\d+)\/$/);
  return m ? parseInt(m[1]) : 0;
}

// Tag helpers for display labels in the dex grid
function getFormTag(name) {
  if (name.endsWith('-shadow'))    return { tag: 'Shadow',    color: '#7c3aed' };
  if (name.endsWith('-purified'))  return { tag: 'Purified',  color: '#06b6d4' };
  if (name.includes('-alola'))     return { tag: 'Alolan',    color: '#f59e0b' };
  if (name.includes('-galar'))     return { tag: 'Galarian',  color: '#ec4899' };
  if (name.includes('-hisui'))     return { tag: 'Hisuian',   color: '#84cc16' };
  if (name.includes('-paldea'))    return { tag: 'Paldean',   color: '#f97316' };
  if (name.includes('-mega'))      return { tag: 'Mega',      color: '#6366f1' };
  if (name.includes('-gmax'))      return { tag: 'G-Max',     color: '#ef4444' };
  if (name.includes('-primal'))    return { tag: 'Primal',    color: '#dc2626' };
  if (name.includes('-origin'))    return { tag: 'Origin',    color: '#8b5cf6' };
  if (name.includes('-sky'))       return { tag: 'Sky',       color: '#38bdf8' };
  if (name.includes('-therian'))   return { tag: 'Therian',   color: '#10b981' };
  if (name.includes('-black') || name.includes('-white')) return { tag: 'Alt', color: '#9ca3af' };
  if (name.includes('-10') || name.includes('-50') || name.includes('-complete')) return { tag: 'Form', color: '#a78bfa' };
  return null;
}

async function fetchPokemonList() {
  if (cache['full_list']) return cache['full_list'];

  // Fetch all base Pokémon (up to 1025 species + alternate forms PokeAPI knows)
  const res = await fetch('https://pokeapi.co/api/v2/pokemon?limit=2000&offset=0');
  const data = await res.json();

  const list = [];

  data.results.forEach(p => {
    const id = idFromUrl(p.url);
    list.push({
      name: p.name,
      id,
      displayName: formatDisplayName(p.name),
      formTag: getFormTag(p.name),
      spriteId: id, // numeric ID used for sprite fallback
      isVirtual: false,
    });
  });

  // Inject Shadow & Purified virtual entries
  // We add them after the real list so they appear in their own section
  SHADOW_IDS.forEach(id => {
    const base = list.find(p => p.id === id && !p.name.includes('-'));
    if (!base) return;
    list.push({
      name: base.name + '-shadow',
      id,
      displayName: formatDisplayName(base.name) + ' (Shadow)',
      formTag: { tag: 'Shadow', color: '#7c3aed' },
      spriteId: id,
      isVirtual: true,
      baseName: base.name,
      shadowType: 'shadow',
    });
    list.push({
      name: base.name + '-purified',
      id,
      displayName: formatDisplayName(base.name) + ' (Purified)',
      formTag: { tag: 'Purified', color: '#06b6d4' },
      spriteId: id,
      isVirtual: true,
      baseName: base.name,
      shadowType: 'purified',
    });
  });

  cache['full_list'] = list;
  return list;
}

function formatDisplayName(name) {
  return name
    .replace(/-mega-[xy]$/, m => ' Mega' + m.slice(-2).toUpperCase())
    .replace(/-mega$/, ' Mega')
    .replace(/-gmax$/, ' G-Max')
    .replace(/-alola$/, ' (Alolan)')
    .replace(/-galar$/, ' (Galarian)')
    .replace(/-hisui$/, ' (Hisuian)')
    .replace(/-paldea$/, ' (Paldean)')
    .replace(/-primal$/, ' (Primal)')
    .replace(/-origin$/, ' (Origin)')
    .replace(/-therian$/, ' (Therian)')
    .replace(/-shadow$/, '')
    .replace(/-purified$/, '')
    .split('-')
    .map(w => w.charAt(0).toUpperCase() + w.slice(1))
    .join(' ');
}

function getGoStats(pokemon) {
  const stats = {};
  pokemon.stats.forEach(s => {
    stats[s.stat.name] = s.base_stat;
  });
  // Pokémon GO uses modified base stats
  const attack = Math.round(2 * (stats['attack'] * 7/8 + stats['special-attack'] * 1/8) + (stats['speed'] > 0 ? Math.floor(stats['speed'] / 2) : 0) / 4);
  const defense = Math.round(2 * (stats['defense'] * 7/8 + stats['special-defense'] * 1/8) + (stats['speed'] > 0 ? Math.floor(stats['speed'] / 2) : 0) / 4);
  const hp = Math.floor(stats['hp'] * 1.75 + 50);
  // Simplified but more accurate GO formula
  const goAtk = Math.max(1, Math.round((stats['attack'] + stats['special-attack']) * 0.875 + stats['speed'] * 0.125));
  const goDef = Math.max(1, Math.round((stats['defense'] + stats['special-defense']) * 0.875 + stats['speed'] * 0.125));
  const goHP = Math.max(1, Math.floor(stats['hp'] * 1.75 + 50));
  return { attack: goAtk, defense: goDef, hp: goHP, rawStats: stats };
}

function TypeBadge({ type, size = 'sm' }) {
  const color = TYPE_COLORS[type] || '#888';
  const pad = size === 'lg' ? 'px-3 py-1 text-xs' : 'px-2 py-0.5 text-xs';
  return (
    <span className={`type-badge ${pad} font-bold`} style={{ background: color + '33', color: color, border: `1px solid ${color}66` }}>
      {capitalize(type)}
    </span>
  );
}

function StatBar({ label, value, max = 300, color = '#818cf8' }) {
  const pct = Math.min(100, (value / max) * 100);
  const getColor = (v) => v >= 200 ? '#34d399' : v >= 150 ? '#60a5fa' : v >= 100 ? '#818cf8' : v >= 50 ? '#fbbf24' : '#f87171';
  const barColor = color === 'auto' ? getColor(value) : color;
  return (
    <div className="flex items-center gap-2 mb-1.5">
      <span className="text-gray-400 text-xs w-20 shrink-0">{label}</span>
      <div className="stat-bar flex-1">
        <div className="stat-fill" style={{ width: `${pct}%`, background: `linear-gradient(90deg, ${barColor}aa, ${barColor})` }} />
      </div>
      <span className="text-white text-xs w-8 text-right font-semibold">{value}</span>
    </div>
  );
}

function Toggle({ value, onChange, label, icon }) {
  return (
    <button onClick={() => onChange(!value)}
      className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all duration-200 ${value ? 'bg-indigo-600 text-white' : 'bg-white/10 text-gray-400 hover:bg-white/15'}`}>
      {icon && <span>{icon}</span>}
      {label}
    </button>
  );
}

function LoadingSpinner({ size = 'md' }) {
  const s = size === 'sm' ? 'w-6 h-6' : size === 'lg' ? 'w-16 h-16' : 'w-10 h-10';
  return (
    <div className={`${s} border-4 border-indigo-500/30 border-t-indigo-500 rounded-full animate-spin`} />
  );
}

function PokemonImage({ pokemon, isShiny, is3D, className = '', size = 96 }) {
  const [imgError, setImgError] = React.useState(false);
  const [loaded, setLoaded] = React.useState(false);

  let src = null;
  if (!imgError) {
    if (is3D) {
      src = isShiny
        ? pokemon?.sprites?.other?.home?.front_shiny
        : pokemon?.sprites?.other?.home?.front_default;
    }
    if (!src || imgError) {
      src = isShiny
        ? pokemon?.sprites?.other?.['official-artwork']?.front_shiny
        : pokemon?.sprites?.other?.['official-artwork']?.front_default;
    }
    if (!src) {
      src = isShiny ? pokemon?.sprites?.front_shiny : pokemon?.sprites?.front_default;
    }
  }

  return (
    <div className="relative flex items-center justify-center" style={{ width: size, height: size }}>
      {!loaded && <LoadingSpinner size="sm" />}
      {src && (
        <img src={src} alt={pokemon?.name || ''} width={size} height={size}
          className={`pokemon-img ${isShiny ? 'shiny-glow' : ''} ${className} ${loaded ? 'opacity-100' : 'opacity-0'}`}
          style={{ transition: 'opacity 0.3s', objectFit: 'contain', width: size, height: size }}
          onLoad={() => setLoaded(true)}
          onError={() => { setImgError(true); setLoaded(true); }} />
      )}
      {(!src || imgError) && loaded && (
        <div className="flex items-center justify-center text-gray-600" style={{ width: size, height: size }}>
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5">
            <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </div>
      )}
    </div>
  );
}

  const handleSubmit = (e) => {

  return (
    <div ref={ref} className="relative w-full max-w-xl">
      <form onSubmit={handleSubmit} className="relative">

  const levelOptions = React.useMemo(() => {
    const opts = [];
    for (let i = 1; i <= 50; i += 0.5) opts.push(i);
    return opts;
  }, []);

  const cp = React.useMemo(() => {
    if (!goStats) return 0;
    return calcCP(goStats.attack, goStats.defense, goStats.hp, atkIV, defIV, hpIV, level);
  }, [goStats, level, atkIV, defIV, hpIV]);

  const hp = React.useMemo(() => {
    if (!goStats) return 0;
    return calcHP(goStats.hp, hpIV, level);

      <div className="cp-display rounded-2xl p-5 text-center">
        <p className="text-gray-400 text-xs uppercase tracking-widest mb-1">Combat Power</p>

          <div className="stat-fill" style={{ width: `${cpPct}%`, background: 'linear-gradient(90deg, #6366f1, #a855f7, #ec4899)' }} />
        </div>
        <p className="text-gray-500 text-xs mt-1">{cpPct.toFixed(1)}% of max CP ({maxCP.toLocaleString()})</p>

function parseEvoChain(chain) {
  const stages = [];
  const traverse = (node, stage) => {
    if (!stages[stage]) stages[stage] = [];
    const detail = node.evolution_details?.[0];
    let req = '';
    if (detail) {
      if (detail.min_level) req = `Lv.${detail.min_level}`;
      else if (detail.item) req = capitalize(detail.item.name.replace(/-/g,' '));
      else if (detail.held_item) req = capitalize(detail.held_item.name.replace(/-/g,' '));
      else if (detail.trigger?.name === 'trade') req = 'Trade';
      else if (detail.min_happiness) req = `Happy (${detail.min_happiness})`;
      else if (detail.known_move) req = capitalize(detail.known_move.name.replace(/-/g,' '));
      else if (detail.location) req = 'Location';
      else req = capitalize((detail.trigger?.name || '').replace(/-/g,' '));
    }
    stages[stage].push({ name: node.species.name, req, hasEvos: node.evolves_to.length > 0 });
    node.evolves_to.forEach(n => traverse(n, stage + 1));
  };
  traverse(chain, 0);
  return stages;
}

function EvolutionChain({ speciesName, isShiny, is3D, onSelect, activeName }) {
  const [stages, setStages] = React.useState(null);
  const [loading, setLoading] = React.useState(false);

  React.useEffect(() => {
    if (!speciesName) return;
    setLoading(true); setStages(null);
    fetchSpecies(speciesName)
      .then(sp => sp ? fetchEvolutionChain(sp.evolution_chain.url) : null)
      .then(chain => { if (chain) setStages(parseEvoChain(chain.chain)); })
      .catch(() => {})
      .finally(() => setLoading(false));
  }, [speciesName]);

  if (loading) return <div className="flex justify-center py-4"><LoadingSpinner /></div>;
  if (!stages) return null;
  if (stages.length <= 1 && stages[0]?.length <= 1) return (
    <div className="text-gray-600 text-sm text-center py-2">No evolutions</div>
  );

  return (
    <div className="flex flex-wrap items-center justify-center gap-1 py-2">
      {stages.map((stage, si) => (
        <React.Fragment key={si}>
          {si > 0 && (
            <div className="flex flex-col gap-2">
              {stage.map(node => node.req && (
                <EvoArrow key={node.name} detail={node.req} />
              ))}
              {!stage.some(n => n.req) && <EvoArrow detail="" />}
            </div>
          )}
          <div className={`flex flex-col gap-2 ${stage.length > 1 ? 'justify-center' : ''}`}>
            {stage.map(node => (
              <EvoNode key={node.name} name={node.name} isShiny={isShiny} is3D={is3D}
                onSelect={onSelect} isActive={node.name === activeName} />
            ))}
          </div>
        </React.Fragment>
      ))}
    </div>
  );
}

                </div>
                <span className={`text-xs w-5 font-bold ${winner==='B'?'text-pink-400':'text-gray-500'}`}>{vB}</span>
              </div>
            );
          })}
        </div>
      )}

];

function FormTag({ tag, color }) {
  return (
    <span className="text-xs font-bold px-1.5 py-0.5 rounded-md leading-none"
      style={{ background: color + '33', color, border: `1px solid ${color}55` }}>
      {tag}
    </span>
  );
}

function PokedexGrid({ onSelect, activeName }) {
  const [allPokemon, setAllPokemon] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [filter, setFilter] = React.useState('');
  const [genFilter, setGenFilter] = React.useState('all');
  const [formFilter, setFormFilter] = React.useState('all'); // all | base | alolan | galarian | hisuian | paldean | mega | shadow | purified
  const [page, setPage] = React.useState(0);
  const PER_PAGE = 48;

  React.useEffect(() => {
    fetchPokemonList().then(list => { setAllPokemon(list); setLoading(false); }).catch(() => setLoading(false));
  }, []);

  const filtered = React.useMemo(() => {
    let list = allPokemon;

    // Text filter
    if (filter.trim()) {
      const q = filter.toLowerCase().trim();
      list = list.filter(p =>
        p.name.includes(q) ||
        p.displayName.toLowerCase().includes(q) ||
        String(p.id).startsWith(q)
      );
    }

    // Generation filter
    if (genFilter !== 'all') {
      const gen = GENERATIONS.find(g => g.label === genFilter);
      if (gen) list = list.filter(p => p.id >= gen.min && p.id <= gen.max);
    }

    // Form filter
    if (formFilter === 'base') {
      list = list.filter(p => !p.isVirtual && !p.formTag);
    } else if (formFilter === 'shadow') {
      list = list.filter(p => p.shadowType === 'shadow');
    } else if (formFilter === 'purified') {
      list = list.filter(p => p.shadowType === 'purified');
    } else if (formFilter === 'alolan') {
      list = list.filter(p => p.name.includes('-alola'));
    } else if (formFilter === 'galarian') {
      list = list.filter(p => p.name.includes('-galar'));
    } else if (formFilter === 'hisuian') {
      list = list.filter(p => p.name.includes('-hisui'));
    } else if (formFilter === 'paldean') {
      list = list.filter(p => p.name.includes('-paldea'));
    } else if (formFilter === 'mega') {
      list = list.filter(p => p.name.includes('-mega') || p.name.includes('-primal'));
    } else if (formFilter === 'forms') {
      list = list.filter(p => p.formTag && !p.isVirtual);
    }

    return list;
  }, [allPokemon, filter, genFilter, formFilter]);

  // Reset page on filter change
  React.useEffect(() => { setPage(0); }, [filter, genFilter, formFilter]);

  const totalPages = Math.ceil(filtered.length / PER_PAGE);
  const visible = filtered.slice(page * PER_PAGE, (page + 1) * PER_PAGE);

  const formFilters = [
    { id: 'all',      label: 'All' },
    { id: 'base',     label: 'Base' },
    { id: 'alolan',   label: 'Alolan',   color: '#f59e0b' },
    { id: 'galarian', label: 'Galarian', color: '#ec4899' },
    { id: 'hisuian',  label: 'Hisuian',  color: '#84cc16' },
    { id: 'paldean',  label: 'Paldean',  color: '#f97316' },
    { id: 'mega',     label: 'Mega',     color: '#6366f1' },
    { id: 'forms',    label: 'Forms',    color: '#a78bfa' },
    { id: 'shadow',   label: '👻 Shadow',   color: '#7c3aed' },
    { id: 'purified', label: '✨ Purified',  color: '#06b6d4' },
  ];

  return (
    <div className="space-y-3">
      {/* Search */}
      <div className="relative">
        <div className="absolute left-3 top-1/2 -translate-y-1/2 text-indigo-400">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
        </div>
        <input value={filter} onChange={e => setFilter(e.target.value)}
          placeholder="Filter by name or #..." className="w-full pl-8 pr-3 py-2 bg-white/10 border border-white/15 rounded-lg text-white text-xs placeholder-gray-600 focus:outline-none focus:border-indigo-500 transition-colors" />
        {filter && (
          <button onClick={() => setFilter('')} className="absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-600 hover:text-gray-400">✕</button>
        )}
      </div>

      {/* Generation tabs */}
      <div className="flex gap-1 flex-wrap">
        <button onClick={() => setGenFilter('all')}
          className={`px-2 py-1 rounded-md text-xs font-semibold transition-all ${genFilter==='all' ? 'bg-indigo-600 text-white' : 'glass text-gray-500 hover:text-white'}`}>
          All
        </button>
        {GENERATIONS.map(g => (
          <button key={g.label} onClick={() => setGenFilter(g.label)}
            className={`px-2 py-1 rounded-md text-xs font-semibold transition-all ${genFilter===g.label ? 'bg-indigo-600 text-white' : 'glass text-gray-500 hover:text-white'}`}>
            {g.label}
          </button>
        ))}
      </div>

      {/* Form filters */}
      <div className="flex gap-1 flex-wrap">
        {formFilters.map(f => (
          <button key={f.id} onClick={() => setFormFilter(f.id)}
            className="px-2 py-0.5 rounded-md text-xs font-semibold transition-all"
            style={formFilter === f.id
              ? { background: (f.color || '#6366f1') + '33', color: f.color || '#818cf8', border: `1px solid ${f.color || '#6366f1'}55` }
              : { background: 'rgba(255,255,255,0.06)', color: '#6b7280', border: '1px solid rgba(255,255,255,0.1)' }}>
            {f.label}
          </button>
        ))}
      </div>

      {/* Count */}
      <p className="text-gray-600 text-xs">{filtered.length.toLocaleString()} Pokémon</p>

      {loading ? (
        <div className="flex justify-center py-8"><LoadingSpinner /></div>
      ) : (
        <>
          <div className="pokedex-grid max-h-[480px] overflow-y-auto pr-1">
            {visible.map(p => {
              const spriteFilter = p.shadowType === 'shadow'
                ? 'brightness(0.55) saturate(2) hue-rotate(245deg)'
                : p.shadowType === 'purified'
                ? 'brightness(1.1) saturate(0.35)'
                : undefined;
              const isActive = activeName === p.name;
              return (
                <button key={p.name} onClick={() => onSelect(p.name)}
                  className={`card-hover glass rounded-xl p-2 flex flex-col items-center gap-1 transition-all duration-200 ${isActive ? 'ring-2 ring-indigo-500 bg-indigo-500/20' : 'hover:bg-white/10'}`}>
                  <div style={{ filter: spriteFilter }}>
                    <img src={`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.spriteId || p.id}.png`}
                      width="52" height="52" className="object-contain" alt={p.displayName} loading="lazy" />
                  </div>
                  <span className="text-gray-300 text-xs font-medium leading-tight text-center line-clamp-2">{p.displayName}</span>
                  <div className="flex flex-wrap gap-0.5 justify-center">
                    <span className="text-gray-600 text-xs">#{padId(p.id)}</span>
                    {p.formTag && <FormTag tag={p.formTag.tag} color={p.formTag.color} />}
                  </div>
                </button>
              );
            })}
            {visible.length === 0 && (
              <div className="col-span-full py-8 text-center text-gray-600 text-sm">No Pokémon match your filters</div>
            )}
          </div>

          {totalPages > 1 && (
            <div className="flex items-center justify-between gap-2">
              <button onClick={() => setPage(p => Math.max(0, p-1))} disabled={page===0}
                className="px-3 py-1.5 glass rounded-lg text-xs text-gray-400 disabled:opacity-30 hover:text-white transition-colors">← Prev</button>
              <span className="text-gray-500 text-xs">{page+1} / {totalPages}</span>
              <button onClick={() => setPage(p => Math.min(totalPages-1, p+1))} disabled={page===totalPages-1}
                className="px-3 py-1.5 glass rounded-lg text-xs text-gray-400 disabled:opacity-30 hover:text-white transition-colors">Next →</button>
            </div>
          )}
        </>
      )}
    </div>
  );
}

// ===================== IV CHART =====================
function IVChart({ pokemon }) {
  const goStats = React.useMemo(() => pokemon ? getGoStats(pokemon) : null, [pokemon]);
  const [level, setLevel] = React.useState(40);
  const [minCP, setMinCP] = React.useState('');
  const [maxCP, setMaxCP] = React.useState('');
  const [sortBy, setSortBy] = React.useState('iv'); // 'iv' | 'cp' | 'atk' | 'def' | 'hp'
  const [showTop, setShowTop] = React.useState(50);
  const [filterPerfect, setFilterPerfect] = React.useState(false);
  const [highlightIV, setHighlightIV] = React.useState(null); // null | 'hundo' | 'lucky' | 'great' | 'ultra'

  const allRows = React.useMemo(() => {
    if (!goStats) return [];
    const rows = [];
    for (let a = 15; a >= 0; a--) {
      for (let d = 15; d >= 0; d--) {
        for (let h = 15; h >= 0; h--) {
          const cp = calcCP(goStats.attack, goStats.defense, goStats.hp, a, d, h, level);
          const hp = calcHP(goStats.hp, h, level);
          const ivPct = Math.round(((a + d + h) / 45) * 100);
          rows.push({ a, d, h, cp, hp, ivPct });
        }
      }
    }
    return rows;
  }, [goStats, level]);

  const filtered = React.useMemo(() => {
    let rows = allRows;
    const lo = parseInt(minCP) || 0;
    const hi = parseInt(maxCP) || Infinity;
    if (lo > 0 || hi < Infinity) rows = rows.filter(r => r.cp >= lo && r.cp <= hi);
    if (filterPerfect) rows = rows.filter(r => r.a === 15 && r.d === 15 && r.h === 15);

    if (highlightIV === 'hundo') rows = rows.filter(r => r.ivPct === 100);
    else if (highlightIV === 'lucky') rows = rows.filter(r => r.a >= 12 && r.d >= 12 && r.h >= 12);
    else if (highlightIV === 'great') rows = rows.filter(r => r.ivPct >= 82);
    else if (highlightIV === 'ultra') rows = rows.filter(r => r.ivPct >= 67);

    const key = sortBy === 'cp' ? 'cp' : sortBy === 'atk' ? 'a' : sortBy === 'def' ? 'd' : sortBy === 'hp' ? 'h' : 'ivPct';
    rows = [...rows].sort((a, b) => b[key] - a[key]);
    return rows.slice(0, showTop);
  }, [allRows, minCP, maxCP, filterPerfect, highlightIV, sortBy, showTop]);

  const getIVColor = (pct) => {
    if (pct === 100) return { bg: 'rgba(251,191,36,0.25)', border: 'rgba(251,191,36,0.6)', text: '#fbbf24' };
    if (pct >= 98) return { bg: 'rgba(52,211,153,0.2)', border: 'rgba(52,211,153,0.5)', text: '#34d399' };
    if (pct >= 93) return { bg: 'rgba(96,165,250,0.2)', border: 'rgba(96,165,250,0.5)', text: '#60a5fa' };
    if (pct >= 82) return { bg: 'rgba(129,140,248,0.15)', border: 'rgba(129,140,248,0.4)', text: '#818cf8' };
    if (pct >= 67) return { bg: 'rgba(167,139,250,0.12)', border: 'rgba(167,139,250,0.3)', text: '#a78bfa' };
    return { bg: 'rgba(255,255,255,0.04)', border: 'rgba(255,255,255,0.1)', text: '#9ca3af' };
  };

  const getIVLabel = (pct) => {
    if (pct === 100) return { label: '100%', color: '#fbbf24' };
    if (pct >= 98) return { label: '98%+', color: '#34d399' };
    if (pct >= 93) return { label: '93%+', color: '#60a5fa' };
    if (pct >= 82) return { label: '82%+', color: '#818cf8' };
    if (pct >= 67) return { label: '67%+', color: '#a78bfa' };
    return { label: 'Low', color: '#6b7280' };
  };

  const totalCount = allRows.length; // always 4096

  if (!pokemon) return (
    <div className="flex flex-col items-center justify-center h-48 text-gray-600 gap-3">
      <p className="text-sm">Select a Pokémon to view the IV chart</p>
    </div>
  );

  return (
    <div className="animate-slide-up space-y-4">
      {/* Controls */}
      <div className="space-y-3">
        {/* Level slider */}
        <div className="glass rounded-xl p-4 space-y-2">
          <div className="flex justify-between items-center">
            <label className="text-gray-300 text-sm font-semibold">Level</label>
            <span className="text-indigo-400 font-bold text-sm bg-indigo-500/20 px-2 py-0.5 rounded-lg">{level}</span>
          </div>
          <input type="range" min="1" max="50" step="0.5" value={level}
            onChange={e => setLevel(parseFloat(e.target.value))}
            className="slider-thumb w-full"
            style={{ background: `linear-gradient(90deg, #6366f1 ${((level-1)/49)*100}%, rgba(255,255,255,0.1) ${((level-1)/49)*100}%)` }} />
          <div className="flex justify-between text-gray-600 text-xs"><span>1</span><span>25</span><span>50</span></div>
        </div>

        {/* CP Range filter */}
        <div className="glass rounded-xl p-4">
          <p className="text-gray-300 text-sm font-semibold mb-2">Filter by CP Range</p>
          <div className="flex gap-2 items-center">
            <input type="number" value={minCP} onChange={e => setMinCP(e.target.value)} placeholder="Min CP"
              className="flex-1 bg-white/10 border border-white/20 rounded-lg px-3 py-2 text-white text-sm placeholder-gray-600 focus:outline-none focus:border-indigo-500 transition-colors" />
            <span className="text-gray-600">–</span>
            <input type="number" value={maxCP} onChange={e => setMaxCP(e.target.value)} placeholder="Max CP"
              className="flex-1 bg-white/10 border border-white/20 rounded-lg px-3 py-2 text-white text-sm placeholder-gray-600 focus:outline-none focus:border-indigo-500 transition-colors" />
            <button onClick={() => { setMinCP(''); setMaxCP(''); }}
              className="px-3 py-2 glass rounded-lg text-gray-400 hover:text-white text-xs transition-colors">✕</button>
          </div>
        </div>

        {/* Quick IV tier filters */}
        <div className="flex flex-wrap gap-2">
          {[
            ['All', null, '#6b7280'],
            ['★ Hundo (15/15/15)', 'hundo', '#fbbf24'],
            ['☆ Lucky (12+)', 'lucky', '#34d399'],
            ['≥98%', 'great', '#60a5fa'],
            ['≥82%', 'ultra', '#818cf8'],
          ].map(([label, val, color]) => (
            <button key={label} onClick={() => setHighlightIV(val)}
              className="px-3 py-1.5 rounded-lg text-xs font-semibold transition-all duration-200"
              style={{
                background: highlightIV === val ? color + '33' : 'rgba(255,255,255,0.06)',
                border: `1px solid ${highlightIV === val ? color : 'rgba(255,255,255,0.1)'}`,
                color: highlightIV === val ? color : '#9ca3af'
              }}>
              {label}
            </button>
          ))}
        </div>

        {/* Sort + Show count */}
        <div className="flex gap-2 flex-wrap items-center">
          <span className="text-gray-500 text-xs">Sort:</span>
          {[['IV%','iv'],['CP','cp'],['ATK','atk'],['DEF','def'],['HP','hp']].map(([l,v]) => (
            <button key={v} onClick={() => setSortBy(v)}
              className={`px-2.5 py-1 rounded-lg text-xs font-semibold transition-all ${sortBy===v ? 'bg-indigo-600 text-white' : 'glass text-gray-400 hover:text-white'}`}>
              {l}
            </button>
          ))}
          <span className="ml-auto text-gray-600 text-xs">Showing {filtered.length} of {allRows.filter(r => {
            const lo = parseInt(minCP)||0, hi = parseInt(maxCP)||Infinity;
            const cpOk = r.cp >= lo && r.cp <= hi;
            const prefOk = !filterPerfect || (r.a===15&&r.d===15&&r.h===15);
            return cpOk && prefOk;
          }).length}</span>
        </div>
      </div>

      {/* Legend */}
      <div className="flex flex-wrap gap-2">
        {[
          ['100% (Hundo)', '#fbbf24'],
          ['98%+ (Near)', '#34d399'],
          ['93%+', '#60a5fa'],
          ['82%+', '#818cf8'],
          ['67%+', '#a78bfa'],
          ['Below', '#6b7280'],
        ].map(([label, color]) => (
          <div key={label} className="flex items-center gap-1.5">
            <div className="w-3 h-3 rounded-sm" style={{ background: color + '55', border: `1px solid ${color}` }} />
            <span className="text-gray-500 text-xs">{label}</span>
          </div>
        ))}
      </div>

      {/* Table */}
      <div className="glass rounded-xl overflow-hidden">
        <div className="overflow-x-auto">
          <table className="w-full text-xs">
            <thead>
              <tr className="border-b border-white/10" style={{ background: 'rgba(255,255,255,0.04)' }}>
                <th className="px-3 py-2.5 text-left text-gray-400 font-semibold w-10">#</th>
                <th className="px-3 py-2.5 text-center text-gray-400 font-semibold">IV</th>
                <th className="px-3 py-2.5 text-center text-gray-400 font-semibold">ATK</th>
                <th className="px-3 py-2.5 text-center text-gray-400 font-semibold">DEF</th>
                <th className="px-3 py-2.5 text-center text-gray-400 font-semibold">HP IV</th>
                <th className="px-3 py-2.5 text-center text-red-400 font-semibold">CP</th>
                <th className="px-3 py-2.5 text-center text-green-400 font-semibold">HP</th>
                <th className="px-3 py-2.5 text-center text-gray-400 font-semibold">Quality</th>
              </tr>
            </thead>
            <tbody>
              {filtered.map((row, i) => {
                const { bg, border, text } = getIVColor(row.ivPct);
                const { label: qualLabel, color: qualColor } = getIVLabel(row.ivPct);
                const isHundo = row.a === 15 && row.d === 15 && row.h === 15;
                return (
                  <tr key={`${row.a}-${row.d}-${row.h}`}
                    className="border-b transition-colors hover:bg-white/5"
                    style={{ borderColor: 'rgba(255,255,255,0.05)', background: bg }}>
                    <td className="px-3 py-2 text-gray-600">{i + 1}</td>
                    <td className="px-3 py-2 text-center font-bold" style={{ color: text }}>
                      {row.ivPct}%
                    </td>
                    <td className="px-3 py-2 text-center">
                      <span className="font-mono font-semibold" style={{ color: row.a === 15 ? '#f87171' : row.a >= 13 ? '#fca5a5' : '#9ca3af' }}>{row.a}</span>
                    </td>
                    <td className="px-3 py-2 text-center">
                      <span className="font-mono font-semibold" style={{ color: row.d === 15 ? '#60a5fa' : row.d >= 13 ? '#93c5fd' : '#9ca3af' }}>{row.d}</span>
                    </td>
                    <td className="px-3 py-2 text-center">
                      <span className="font-mono font-semibold" style={{ color: row.h === 15 ? '#34d399' : row.h >= 13 ? '#6ee7b7' : '#9ca3af' }}>{row.h}</span>
                    </td>
                    <td className="px-3 py-2 text-center font-bold text-white">{row.cp.toLocaleString()}</td>
                    <td className="px-3 py-2 text-center text-green-400 font-semibold">{row.hp}</td>
                    <td className="px-3 py-2 text-center">
                      <span className="px-2 py-0.5 rounded-full text-xs font-semibold"
                        style={{ background: qualColor + '22', color: qualColor, border: `1px solid ${qualColor}44` }}>
                        {isHundo ? '⭐ Perfect' : qualLabel}
                      </span>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          {filtered.length === 0 && (
            <div className="py-10 text-center text-gray-600 text-sm">
              No IV combinations match your filters
            </div>
          )}
        </div>
      </div>

      {/* Show more button */}
      {showTop < allRows.length && (
        <button onClick={() => setShowTop(t => t + 100)}
          className="w-full py-2.5 glass rounded-xl text-gray-400 hover:text-white text-sm transition-colors hover:bg-white/10">
          Show more ({allRows.length - showTop} remaining)
        </button>
      )}
    </div>
  );
}

// ===================== MAIN POKEMON CARD =====================
function PokemonCard({ pokemon, species, isShiny, is3D, shadowType, onToggleShiny, onToggle3D }) {
  const goStats = getGoStats(pokemon);
  const types = pokemon.types.map(t => t.type.name);
  const mainType = types[0];
  const typeColor = TYPE_COLORS[mainType] || '#6366f1';

  const shadowColor = shadowType === 'shadow' ? '#7c3aed' : shadowType === 'purified' ? '#06b6d4' : null;
  const shadowLabel = shadowType === 'shadow' ? '👻 Shadow' : shadowType === 'purified' ? '✨ Purified' : null;

  // Shadow Pokémon get +20% ATK, -20% DEF in GO raids; Purified get +2 to all IVs floor
  const displayAtk  = shadowType === 'shadow'   ? Math.round(goStats.attack  * 1.2) : goStats.attack;
  const displayDef  = shadowType === 'shadow'   ? Math.round(goStats.defense * 0.8) : goStats.defense;
  const shadowNote  = shadowType === 'shadow'   ? '(×1.2 ATK / ×0.8 DEF in raids)' :
                      shadowType === 'purified' ? '(+2 IV floor on all stats when purified)' : null;

  const spriteFilter = shadowType === 'shadow'
    ? 'brightness(0.6) saturate(2) hue-rotate(240deg)'
    : shadowType === 'purified'
    ? 'brightness(1.15) saturate(0.35) contrast(1.1)'
    : undefined;

  return (
    <div className="glass-dark rounded-2xl overflow-hidden animate-slide-up relative"
      style={{ border: `1px solid ${shadowColor ? shadowColor + '55' : typeColor + '33'}` }}>
      {/* Shadow/Purified banner */}
      {shadowLabel && (
        <div className="px-5 pt-3 pb-0">
          <div className="rounded-lg px-3 py-1.5 flex items-center gap-2 text-xs font-bold"
            style={{ background: shadowColor + '22', border: `1px solid ${shadowColor}44`, color: shadowColor }}>
            <span>{shadowLabel}</span>
            {shadowNote && <span className="text-xs font-normal opacity-70">{shadowNote}</span>}
          </div>
        </div>
      )}
      {/* Header gradient */}
      <div className="relative p-5 pb-2" style={{ background: `linear-gradient(135deg, ${typeColor}22, transparent)` }}>
        <div className="flex justify-between items-start">
          <div>
            <p className="text-gray-500 text-xs font-medium">#{padId(pokemon.id)}</p>
            <h2 className="text-white text-2xl font-black mt-0.5">
              {formatDisplayName(pokemon.name)}
              {shadowLabel && <span className="ml-2 text-base font-semibold" style={{color: shadowColor}}>{shadowLabel}</span>}
            </h2>
            {species?.genera?.find(g => g.language.name === 'en') && (
              <p className="text-gray-500 text-xs">{species.genera.find(g => g.language.name === 'en').genus}</p>
            )}
            <div className="flex gap-1.5 mt-2 flex-wrap">
              {types.map(t => <TypeBadge key={t} type={t} size="lg" />)}

          </div>
          <div className="flex flex-col gap-1.5 items-end">
            <Toggle value={isShiny} onChange={onToggleShiny} label="✨ Shiny" />
            <Toggle value={is3D} onChange={onToggle3D} label="🎮 3D" />
          </div>
        </div>

        {/* Sprite */}
        <div className="flex justify-center mt-2">
          <div className="relative">
            <div className="absolute inset-0 rounded-full blur-3xl opacity-20"
              style={{ background: shadowColor || typeColor }} />
            <div style={{ filter: spriteFilter }}>
              <PokemonImage pokemon={pokemon} isShiny={isShiny} is3D={is3D} size={160} className="relative z-10" />
            </div>
            {shadowType === 'shadow' && (
              <div className="absolute inset-0 rounded-full pointer-events-none"
                style={{ background: 'radial-gradient(circle, rgba(124,58,237,0.15) 0%, transparent 70%)' }} />
            )}
          </div>
        </div>

        {isShiny && (
          <div className="absolute top-3 left-1/2 -translate-x-1/2">
            <span className="text-xs bg-yellow-500/20 text-yellow-400 border border-yellow-500/30 rounded-full px-3 py-0.5 font-semibold">✨ Shiny</span>
          </div>
        )}
      </div>

      {/* CP Preview */}
      <div className="px-5 pb-4">
        <div className="grid grid-cols-3 gap-2 text-center mt-2">
          {[['GO ATK', displayAtk, '#f87171'],['GO DEF', displayDef, '#60a5fa'],['STA', goStats.hp, '#34d399']].map(([l,v,c]) => (
            <div key={l} className="rounded-lg p-2" style={{ background: c+'15', border: `1px solid ${c}33` }}>
              <p className="text-xs font-semibold" style={{ color: c }}>{l}</p>
              <p className="text-white font-bold text-lg">{v}</p>
            </div>
          ))}
        </div>
        <div className="mt-3 text-center">
          <p className="text-gray-600 text-xs">Max CP (Lv50 15/15/15)</p>
          <p className="text-indigo-400 font-black text-2xl">{calcCP(goStats.attack, goStats.defense, goStats.hp, 15,15,15,50).toLocaleString()}</p>
        </div>
      </div>
    </div>
  );
}

// ===================== MAIN APP =====================
function App() {
  const [activePokemon, setActivePokemon] = React.useState(null);
  const [activeSpecies, setActiveSpecies] = React.useState(null);
  const [activeShadowType, setActiveShadowType] = React.useState(null); // null | 'shadow' | 'purified'
  const [loading, setLoading] = React.useState(false);
  const [error, setError] = React.useState(null);
  const [isShiny, setIsShiny] = React.useState(false);
  const [is3D, setIs3D] = React.useState(true);
  const [activeTab, setActiveTab] = React.useState('info');
  const [mode, setMode] = React.useState('dex'); // 'dex' | 'compare'
  const [isMobileMenuOpen, setIsMobileMenuOpen] = React.useState(false);
  const [showDex, setShowDex] = React.useState(false);

  const loadPokemon = React.useCallback(async (nameOrId) => {
    setLoading(true);
    setError(null);
    setIsShiny(false);

    // Strip shadow/purified suffix to get the real API name
    let apiName = String(nameOrId).toLowerCase();
    let shadowType = null;
    if (apiName.endsWith('-shadow'))   { shadowType = 'shadow';   apiName = apiName.replace(/-shadow$/, ''); }
    if (apiName.endsWith('-purified')) { shadowType = 'purified'; apiName = apiName.replace(/-purified$/, ''); }

    try {
      const poke = await fetchPokemon(apiName);
      setActivePokemon(poke);
      setActiveShadowType(shadowType);
      setActiveTab('info');
      const sp = await fetchSpecies(poke.species?.name || poke.name).catch(() => null);
      setActiveSpecies(sp);
    } catch (e) {
      setError(`Could not find "${nameOrId}". Try a different name or ID.`);
      setActivePokemon(null);
      setActiveSpecies(null);
      setActiveShadowType(null);
    } finally {
      setLoading(false);
    }
  }, []);

  // Load a default pokemon on startup
  React.useEffect(() => { loadPokemon('mewtwo'); }, []);

  const tabs = [
    { id: 'info', label: 'Info', icon: '📋' },
    { id: 'cp', label: 'CP Calc', icon: '⚡' },
    { id: 'iv', label: 'IV Chart', icon: '🧬' },
    { id: 'evo', label: 'Evolution', icon: '🔄' },
  ];

  return (
    <div className="min-h-screen text-white" style={{ background: 'linear-gradient(135deg, #0a0a0f 0%, #0d0d1a 50%, #0a0f1a 100%)' }}>
      {/* Header */}
      <header className="glass-dark sticky top-0 z-50 px-4 py-3">
        <div className="max-w-7xl mx-auto flex items-center gap-4">
          {/* Logo */}
          <div className="flex items-center gap-2 shrink-0">
            <div className="w-8 h-8 rounded-full flex items-center justify-center" style={{ background: 'linear-gradient(135deg, #ef4444, #dc2626)' }}>
              <div className="w-3 h-3 rounded-full bg-white" />
            </div>
            <div className="hidden sm:block">
              <h1 className="text-white font-black text-sm leading-none">Pokémon GO</h1>
              <p className="text-indigo-400 text-xs font-semibold">Dex &amp; CP Calculator</p>
            </div>
          </div>

          {/* Search */}
          <div className="flex-1 max-w-md">
            <SearchBar onSelect={loadPokemon} />
          </div>

          {/* Mode toggle */}
          <div className="flex gap-2 shrink-0">
            <button onClick={() => setMode('dex')}
              className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${mode==='dex' ? 'bg-indigo-600 text-white' : 'glass text-gray-400 hover:text-white'}`}>
              📖 Dex
            </button>
            <button onClick={() => setMode('compare')}
              className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-all ${mode==='compare' ? 'bg-pink-600 text-white' : 'glass text-gray-400 hover:text-white'}`}>
              ⚖️ Compare
            </button>
          </div>
        </div>
      </header>

      {mode === 'compare' ? (
        <main className="max-w-5xl mx-auto px-4 py-6">
          <div className="mb-4">
            <h2 className="text-white font-black text-xl">Side-by-Side Comparison</h2>
            <p className="text-gray-500 text-sm">Compare stats, CP, and types between two Pokémon</p>
          </div>
          <ComparePanel isShiny={isShiny} is3D={is3D} />
        </main>
      ) : (
        <main className="max-w-7xl mx-auto px-4 py-6">
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">

            {/* Left: Pokédex list (collapsible on mobile) */}
            <div className="lg:col-span-1">
              <div className="glass-dark rounded-2xl p-4">
                <button onClick={() => setShowDex(!showDex)}
                  className="flex items-center justify-between w-full lg:cursor-default mb-3">
                  <h3 className="text-white font-bold text-sm uppercase tracking-widest">Pokédex</h3>
                  <span className="lg:hidden text-gray-400 text-xs">{showDex ? '▲ Hide' : '▼ Show'}</span>
                </button>
                <div className={`${showDex ? 'block' : 'hidden'} lg:block`}>
                  <PokedexGrid onSelect={loadPokemon} activeName={activePokemon?.name} />
                </div>
              </div>
            </div>

            {/* Center: Pokémon card + tabs */}
            <div className="lg:col-span-2 space-y-4">
              {loading && (
                <div className="glass-dark rounded-2xl p-12 flex flex-col items-center gap-4">
                  <LoadingSpinner size="lg" />
                  <p className="text-gray-500 text-sm">Loading Pokémon data...</p>
                </div>
              )}
              {error && !loading && (
                <div className="glass-dark rounded-2xl p-8 text-center">
                  <p className="text-red-400 text-4xl mb-3">😵</p>
                  <p className="text-red-400 font-semibold">{error}</p>
                  <p className="text-gray-600 text-sm mt-1">Try searching for "pikachu", "bulbasaur", or a number like "25"</p>
                </div>
              )}

              {activePokemon && !loading && (
                <>
                  <PokemonCard
                    pokemon={activePokemon} species={activeSpecies}
                    isShiny={isShiny} is3D={is3D}
                    shadowType={activeShadowType}
                    onToggleShiny={setIsShiny} onToggle3D={setIs3D}
                  />

                  {/* Tabs */}
                  <div className="glass-dark rounded-2xl overflow-hidden">
                    <div className="flex border-b border-white/10">
                      {tabs.map(tab => (
                        <button key={tab.id} onClick={() => setActiveTab(tab.id)}
                          className={`flex-1 py-3 text-sm font-semibold transition-all duration-200 flex items-center justify-center gap-1.5 ${activeTab===tab.id ? 'tab-active text-white' : 'text-gray-500 hover:text-gray-300 hover:bg-white/5'}`}>
                          <span>{tab.icon}</span>
                          <span>{tab.label}</span>
                        </button>
                      ))}
                    </div>
                    <div className="p-5">
                      {activeTab === 'info' && (
                        <DetailPanel pokemon={activePokemon} species={activeSpecies} isShiny={isShiny} is3D={is3D} />
                      )}
                      {activeTab === 'cp' && (
                        <CPCalculator pokemon={activePokemon} />
                      )}
                      {activeTab === 'iv' && (
                        <IVChart pokemon={activePokemon} />
                      )}
                      {activeTab === 'evo' && (
                        <div>
                          <p className="text-gray-400 text-xs uppercase tracking-widest font-semibold mb-3">Evolution Chain</p>
                          <EvolutionChain
                            speciesName={activePokemon.name}
                            isShiny={isShiny} is3D={is3D}
                            onSelect={loadPokemon}
                            activeName={activePokemon.name}
                          />
                        </div>
                      )}
                    </div>
                  </div>
                </>
              )}

              {!activePokemon && !loading && !error && (
                <div className="glass-dark rounded-2xl p-12 flex flex-col items-center gap-4 text-center">
                  <div className="text-6xl">🔴</div>
                  <h3 className="text-white font-bold text-xl">Welcome to GO Dex</h3>
                  <p className="text-gray-500 text-sm max-w-sm">Search for any Pokémon by name or ID, or browse the Pokédex on the left to get started.</p>
                </div>
              )}
            </div>
          </div>
        </main>
      )}

      {/* Footer */}
      <footer className="text-center py-6 text-gray-700 text-xs">
        <p>Pokémon GO Dex &amp; CP Calculator • Data from <a href="https://pokeapi.co" className="text-indigo-500 hover:text-indigo-400" target="_blank" rel="noopener">PokéAPI</a></p>
        <p className="mt-1">Not affiliated with Niantic, Inc. or Nintendo</p>
      </footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
